# Scenario h015 — etcd compaction latency (readiness timeout, no cause in events)
# inventory-api's readiness probe times out for real (tcpSocket against a
# port nothing listens on) — Running but never Ready, no crash, no useful
# K8s event. The root cause is visible only in OTel error traces: a sidecar
# emits real OTLP spans (through the live collector → Tempo deployed for
# this pass) shaped like a genuine etcd Range call blowing past its deadline
# after a compaction, matching
# tests/integration/cases/h015_etcd_compaction/otel/traces.json.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: kubeverdict-demo
  labels:
    app: inventory-api
    app.kubernetes.io/name: inventory-api
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-api
  template:
    metadata:
      labels:
        app: inventory-api
        app.kubernetes.io/name: inventory-api
    spec:
      containers:
      - name: inventory-api
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "[inventory-api] Starting v2.4.0"
          while true; do
            echo "level=info msg=\"serving request\" method=GET path=/inventory/sku status=200"
            sleep 5
          done
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 1
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      - name: otel-emitter
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install \
            opentelemetry-sdk==1.25.0 \
            opentelemetry-exporter-otlp-proto-grpc==1.25.0 \
            --disable-pip-version-check && \
          python3 - <<'PYEOF'
          import time, os
          from opentelemetry import trace
          from opentelemetry.sdk.trace import TracerProvider
          from opentelemetry.sdk.trace.export import BatchSpanProcessor
          from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter
          from opentelemetry.sdk.resources import Resource
          from opentelemetry.trace import StatusCode

          OTEL_ENDPOINT = os.getenv("OTEL_ENDPOINT", "otel-collector-opentelemetry-collector.kubeverdict-obs.svc.cluster.local:4317")
          ERROR = ("rpc error: code = DeadlineExceeded desc = context deadline "
                    "exceeded: etcdserver: mvcc: required revision has been compacted")

          resource = Resource.create({
            "service.name":        "inventory-api",
            "k8s.namespace.name":  "kubeverdict-demo",
            "k8s.deployment.name": "inventory-api",
          })
          provider = TracerProvider(resource=resource)
          exporter = OTLPSpanExporter(endpoint=OTEL_ENDPOINT, insecure=True)
          provider.add_span_processor(BatchSpanProcessor(exporter))
          tracer = trace.get_tracer("inventory-api", tracer_provider=provider)

          print(f"[otel-emitter] connected to {OTEL_ENDPOINT}", flush=True)
          while True:
            with tracer.start_as_current_span("GET /inventory/sku") as root:
              root.set_status(StatusCode.ERROR, ERROR)
              with tracer.start_as_current_span("etcdserverpb.KV/Range") as span:
                span.set_attribute("rpc.grpc.status_code", 4)
                span.set_status(StatusCode.ERROR, ERROR)
                span.record_exception(Exception(ERROR))
            print("[otel-emitter] emitted ERROR span: inventory-api/etcdserverpb.KV/Range", flush=True)
            time.sleep(15)
          PYEOF
        env:
        - name: OTEL_ENDPOINT
          value: "otel-collector-opentelemetry-collector.kubeverdict-obs.svc.cluster.local:4317"
        resources:
          requests:
            memory: 64Mi
            cpu: 25m
          limits:
            memory: 128Mi
