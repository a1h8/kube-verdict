{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeverdict.fullname" . }}
  labels:
    {{- include "kubeverdict.labels" . | nindent 4 }}
rules:
  # Core K8s resources (read-only)
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - nodes
      - namespaces
      - services
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
      - serviceaccounts
      - events
    verbs: ["get", "list", "watch"]
  # Apps
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  # RBAC inspection
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  # Metrics
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # Helm releases (Flux / Helm operator CRDs)
  - apiGroups: ["helm.toolkit.fluxcd.io", "helm.sh"]
    resources: ["helmreleases", "helmreleases/status"]
    verbs: ["get", "list", "watch"]
  # Kyverno / OPA policy reports
  - apiGroups: ["wgpolicyk8s.io", "kyverno.io"]
    resources:
      - policyreports
      - clusterpolicyreports
      - admissionreports
    verbs: ["get", "list", "watch"]
  # HPA
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # Quotas and limit ranges (read by discovery), mutating webhooks (policy collector)
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "list"]
  {{- with .Values.rbac.impersonate }}
  {{- if .user }}
  # Impersonation of the configured identity only, by name
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
    resourceNames: [{{ .user | quote }}]
  {{- end }}
  {{- if .groups }}
  - apiGroups: [""]
    resources: ["groups"]
    verbs: ["impersonate"]
    resourceNames: [{{ range $i, $g := .groups }}{{ if $i }}, {{ end }}{{ $g | quote }}{{ end }}]
  {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeverdict.fullname" . }}
  labels:
    {{- include "kubeverdict.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeverdict.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeverdict.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- range .Values.rbac.helmReleaseNamespaces }}
---
# Helm releases of {{ . }}: every Secret of this namespace (rbac.helmReleaseNamespaces, H45)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeverdict.fullname" $ }}-helm-releases
  namespace: {{ . }}
  labels:
    {{- include "kubeverdict.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeverdict.fullname" $ }}-helm-releases
  namespace: {{ . }}
  labels:
    {{- include "kubeverdict.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeverdict.fullname" $ }}-helm-releases
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeverdict.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
