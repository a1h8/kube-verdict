apiVersion: apps/v1
kind: Deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-worker
        app.kubernetes.io/part-of: acme
    spec:
      containers:
      - name: billing-worker
        image: ghcr.io/acme/billing-worker:1.8.0
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 10
metadata:
  name: billing-worker
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-worker
    app.kubernetes.io/part-of: acme
