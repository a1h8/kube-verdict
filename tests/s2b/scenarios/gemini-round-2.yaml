id: dependency-2
family: dependency
question: "why are cart-service pods crashing in shop namespace"
expected_outcome: cause
cause_object: Job/shop/db-migration-v2
origin_object: Job/shop/db-migration-v2
mechanism: "A database migration Job dropped a column required by the running version of cart-service, causing unhandled SQL exceptions and container termination."
passes_if: "names Job/shop/db-migration-v2 or SQL schema incompatibility caused by migration"
partial_if_only: ["StatefulSet/shop/postgres-db"]
chain:
  - from: Deployment/shop/cart-service
    relation: "database connection string and SQL query execution"
    to: StatefulSet/shop/postgres-db
    fields: "Deployment.spec.template.spec.containers[].env (DB_HOST) vs StatefulSet pod network identity"
    abnormal: "Container log on cart-service: 'pq: column cart_items.item_sku does not exist at character 42' at T0-8m"
  - from: StatefulSet/shop/postgres-db
    relation: "database table schema modification"
    to: Job/shop/db-migration-v2
    fields: "Postgres table state vs Job container execution logs"
    abnormal: "Job/db-migration-v2 container log: 'ALTER TABLE cart_items DROP COLUMN item_sku;' executed at T0-10m"
decoys:
  - object: Deployment/shop/frontend
    looks_like: "Frontend service returning 502 Bad Gateway responses"
    why_not: "Frontend is failing because cart-service backend is crashing; frontend is not the root cause."
  - object: ServiceAccount/shop/cart-sa
    looks_like: "Service account token expiration warnings"
    why_not: "Database authentication succeeds; the failure is strictly a SQL schema mismatch."
timeline:
  - "T0-10m: Job/db-migration-v2 runs and drops table column item_sku."
  - "T0-8m: Cart-service pods throw SQL exceptions and crash loop."
  - "T0: Operator asks why cart-service pods are crashing."
objects:
  - "Namespace/shop: Active"
  - "Namespace/kube-system: Active"
