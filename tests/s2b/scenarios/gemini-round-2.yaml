id: netpol-1
family: netpol
question: "why can't checkout service connect to backend-api in store namespace"
expected_outcome: cause
cause_object: NetworkPolicy/store/backend-ingress-isolation
origin_object: NetworkPolicy/store/backend-ingress-isolation
mechanism: "A NetworkPolicy on backend-api permits ingress exclusively from pods labeled tier=frontend, while checkout pods are labeled tier=checkout, causing connection timeouts."
passes_if: "names NetworkPolicy/store/backend-ingress-isolation or the unmatched podSelector rules"
partial_if_only: ["NetworkPolicy/store/backend-ingress-isolation"]
chain:
  - from: Deployment/store/checkout
    relation: "pod-to-service network communication"
    to: Service/store/backend-api
    fields: "Deployment.spec.template.spec.containers[].env (BACKEND_URL) vs Service.spec.clusterIP and spec.ports"
    abnormal: "Container log on checkout: 'Get \"http://backend-api:8080/pay\": dial tcp 10.96.45.12:8080: i/o timeout' at T0-10m"
  - from: Service/store/backend-api
    relation: "Service routes traffic to backend pods selected by label"
    to: StatefulSet/store/backend-api
    fields: "Service.spec.selector vs StatefulSet.spec.template.metadata.labels"
    abnormal: "Endpoints list points to backend pods, but TCP packets sent to pod IPs are dropped"
  - from: StatefulSet/store/backend-api
    relation: "NetworkPolicy ingress pod selection"
    to: NetworkPolicy/store/backend-ingress-isolation
    fields: "StatefulSet.spec.template.metadata.labels vs NetworkPolicy.spec.podSelector and spec.ingress[].from[].podSelector"
    abnormal: "NetworkPolicy/backend-ingress-isolation drops ingress packets from pods lacking label tier=frontend at T0-10m"
decoys:
  - object: Service/store/backend-api
    looks_like: "Service endpoints might be misconfigured or missing"
    why_not: "Service endpoints correctly list all 3 healthy backend-api pod IPs."
  - object: Deployment/store/checkout
    looks_like: "Checkout container environment variable points to wrong port"
    why_not: "Environment variables correctly point to port 8080, matching the service spec."
timeline:
  - "T0-1h: NetworkPolicy/backend-ingress-isolation applied, restricting ingress to tier=frontend pods."
  - "T0-12m: Deployment/checkout updated with tier=checkout label."
  - "T0-10m: Checkout pods log connection timeouts contacting backend-api."
  - "T0: Operator asks why checkout service cannot connect to backend-api."
