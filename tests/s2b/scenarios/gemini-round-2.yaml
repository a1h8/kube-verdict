id: quota-2
family: quota
question: "why are new auth-service pods pending in security namespace"
expected_outcome: cause
cause_object: ConfigMap/security/auth-limits-config
origin_object: ConfigMap/security/auth-limits-config
mechanism: "A ConfigMap change adjusted the cpu request on a background daemon template referenced by a DaemonSet, which consumed the remaining cpu quota and blocked auth-service pod creation."
passes_if: "names ConfigMap/security/auth-limits-config or DaemonSet/security/audit-logger CPU request increase"
partial_if_only: ["ResourceQuota/security/compute-quota"]
chain:
  - from: Deployment/security/auth-service
    relation: "controlled by ReplicaSet"
    to: ReplicaSet/security/auth-service-74b86cfbc8
    fields: "Deployment.spec.selector matches ReplicaSet.spec.selector and ownerReferences"
    abnormal: "Event: FailedCreate on ReplicaSet/auth-service-74b86cfbc8: exceeded quota: compute-quota, requested: cpu=500m at T0-5m"
  - from: ReplicaSet/security/auth-service-74b86cfbc8
    relation: "namespace quota limit"
    to: ResourceQuota/security/compute-quota
    fields: "Pod template resource requests vs ResourceQuota status.hard/used"
    abnormal: "ResourceQuota/compute-quota status.used.requests.cpu equals hard limit 4000m at T0-10m"
  - from: ResourceQuota/security/compute-quota
    relation: "namespace resource consumption by DaemonSet pods"
    to: DaemonSet/security/audit-logger
    fields: "DaemonSet.spec.template.spec.containers[].resources.requests.cpu and node selector matching cluster nodes"
    abnormal: "DaemonSet/audit-logger pods updated template requesting 1000m per node across 4 nodes at T0-15m"
decoys:
  - object: ServiceAccount/security/auth-sa
    looks_like: "ServiceAccount token mount warnings in system logs"
    why_not: "ServiceAccount is fully valid and mounted successfully on all existing pods."
  - object: HorizontalPodAutoscaler/security/auth-service
    looks_like: "HPA target CPU metric is unready"
    why_not: "HPA metrics status is normal; the scheduling block is caused strictly by namespace CPU quota limits."
timeline:
  - "T0-15m: ConfigMap/auth-limits-config edited, increasing audit-logger container CPU request from 250m to 1000m."
  - "T0-10m: DaemonSet/audit-logger rolls out, consuming all remaining namespace CPU quota."
  - "T0-5m: Deployment/auth-service triggers scaling, failing ReplicaSet pod creation due to quota."
  - "T0: Operator asks why new auth-service pods are pending."
