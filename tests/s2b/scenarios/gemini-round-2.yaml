id: netpol-2
family: netpol
question: "why are payment pods failing DNS lookups in payments namespace"
expected_outcome: cause
cause_object: NetworkPolicy/payments/deny-all-egress
origin_object: NetworkPolicy/payments/deny-all-egress
mechanism: "An egress NetworkPolicy blocks all outbound traffic from payment pods, omitting the required egress rule for UDP port 53 to reach CoreDNS."
passes_if: "names NetworkPolicy/payments/deny-all-egress or missing DNS egress rule"
partial_if_only: ["NetworkPolicy/payments/deny-all-egress"]
chain:
  - from: Deployment/payments/payment-app
    relation: "pod container DNS resolution query"
    to: Service/kube-system/kube-dns
    fields: "Deployment.spec.template.spec.dnsPolicy and CoreDNS ClusterIP 10.96.0.10"
    abnormal: "Container log: ';; connection timed out; no servers could be reached' at T0-5m"
  - from: Service/kube-system/kube-dns
    relation: "Endpoints backing CoreDNS service"
    to: Deployment/kube-system/coredns
    fields: "Service.spec.selector vs Deployment.spec.selector"
    abnormal: "CoreDNS endpoints are healthy, but outgoing packets from payment-app to 10.96.0.10:53 are intercepted"
  - from: Deployment/payments/payment-app
    relation: "namespace egress network policy restriction"
    to: NetworkPolicy/payments/deny-all-egress
    fields: "Deployment.metadata.namespace matches NetworkPolicy.metadata.namespace and NetworkPolicy.spec.egress"
    abnormal: "NetworkPolicy/deny-all-egress drops outbound UDP traffic on port 53 at T0-5m"
decoys:
  - object: Deployment/kube-system/coredns
    looks_like: "CoreDNS pods are restarting frequently in kube-system"
    why_not: "CoreDNS pods have zero restarts and successfully resolve queries for other namespaces."
  - object: Service/payments/db-proxy
    looks_like: "Database proxy service IP is unreachable"
    why_not: "Unreachability is a consequence of general egress blocking, not a database service failure."
timeline:
  - "T0-1h: NetworkPolicy/deny-all-egress applied to payments namespace without egress rules for port 53."
  - "T0-10m: Payment pods restarted for configuration refresh."
  - "T0-5m: Payment app containers log DNS connection timeouts."
  - "T0: Operator asks why payment pods are failing DNS lookups."
