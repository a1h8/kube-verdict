  - "Pod/billing/etl-backfill-xyz2: Running"
  - "Service/billing/payment-api-svc: Active"
  - "ConfigMap/billing/app-config: Active"
  - "Secret/billing/db-secret: Active"
  - "ServiceAccount/billing/default: Active"
  - "PodDisruptionBudget/billing/api-pdb: Active"
  - "Deployment/default/nginx: Active"
  - "Service/default/kubernetes: Active"
  - "ConfigMap/default/kube-root-ca.crt: Active"
