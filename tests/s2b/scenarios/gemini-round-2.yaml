id: quota-1
family: quota
question: "why can't payment-api roll out in billing namespace"
expected_outcome: cause
cause_object: Job/billing/etl-backfill
origin_object: Job/billing/etl-backfill
mechanism: "An ETL batch job was updated to request high CPU, exhausting the namespace ResourceQuota cpu requests hard limit and causing ReplicaSet pod creation to fail."
passes_if: "names Job/billing/etl-backfill or the CPU request exhaustion in ResourceQuota/billing/compute-quota"
partial_if_only: ["ResourceQuota/billing/compute-quota"]
chain:
  - from: Deployment/billing/payment-api
    relation: "controlled by ReplicaSet"
    to: ReplicaSet/billing/payment-api-58f7956488
    fields: "Deployment.spec.selector matches ReplicaSet.spec.selector and metadata.ownerReferences"
    abnormal: "Event: FailedCreate on ReplicaSet/payment-api-58f7956488: pods \"payment-api-58f7956488-\" is forbidden: exceeded quota: compute-quota, requested: cpu=2, used: cpu=8, limited: cpu=8 at T0-10m"
  - from: ReplicaSet/billing/payment-api-58f7956488
    relation: "namespace quota constraint"
    to: ResourceQuota/billing/compute-quota
    fields: "ReplicaSet.spec.template.spec.containers[].resources.requests.cpu vs ResourceQuota.status.hard/used"
    abnormal: "ResourceQuota status.used.requests.cpu reaches hard limit of 8cpu at T0-45m"
  - from: ResourceQuota/billing/compute-quota
    relation: "namespace resource consumption"
    to: Job/billing/etl-backfill
    fields: "Job.metadata.namespace matches ResourceQuota.metadata.namespace and pod resource requests"
    abnormal: "Job/etl-backfill pods running with 6cpu total requests since T0-45m"
decoys:
  - object: HorizontalPodAutoscaler/billing/payment-api
    looks_like: "HPA metrics show target CPU utilization at 120%"
    why_not: "HPA is attempting to scale up, but the creation failure is driven by namespace CPU quota exhaustion, not HPA logic."
  - object: Deployment/billing/payment-api
    looks_like: "Deployment has rollout status progressing=False"
    why_not: "This is the symptom of the ReplicaSet creation failure, not the root cause."
timeline:
  - "T0-45m: Job/etl-backfill updated via helm to request 6 CPUs, consuming available namespace CPU quota."
  - "T0-15m: CI/CD pipeline triggers rolling update for Deployment/payment-api."
  - "T0-10m: ReplicaSet/payment-api-58f7956488 emits FailedCreate event due to compute-quota exceeded."
  - "T0: Operator asks why payment-api cannot roll out."
objects:
  - "Namespace/billing: Active"
  - "Namespace/default: Active"
  - "Deployment/billing/payment-api: Available"
  - "ReplicaSet/billing/payment-api-58f7956488: ReplicaFailure"
  - "ResourceQuota/billing/compute-quota: Used 8/8 cpu"
  - "Job/billing/etl-backfill: Running"
  - "HorizontalPodAutoscaler/billing/payment-api: Normal"
