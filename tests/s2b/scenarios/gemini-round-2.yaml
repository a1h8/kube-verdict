id: dependency-1
family: dependency
question: "why is api-gateway failing health checks in microservices namespace"
expected_outcome: cause
cause_object: HelmRelease/microservices/redis-cache
origin_object: HelmRelease/microservices/redis-cache
mechanism: "A Helm chart update misconfigured the Redis readiness probe command, causing all Redis pods to fail readiness and be removed from service endpoints, leading to connection refusals by api-gateway."
passes_if: "names HelmRelease/microservices/redis-cache or StatefulSet/microservices/redis-cache readiness probe failure"
partial_if_only: ["Service/microservices/redis-cache"]
chain:
  - from: Deployment/microservices/api-gateway
    relation: "TCP connection to upstream service"
    to: Service/microservices/redis-cache
    fields: "Deployment.spec.template.spec.containers[].env (REDIS_HOST) vs Service.spec.clusterIP"
    abnormal: "Container log on api-gateway: 'ERR connecting to redis://redis-cache:6379: connection refused' at T0-10m"
  - from: Service/microservices/redis-cache
    relation: "Service endpoints matching pod selectors and readiness"
    to: StatefulSet/microservices/redis-cache
    fields: "Service.spec.selector vs StatefulSet.spec.selector and pod readiness status"
    abnormal: "Endpoints list for redis-cache is empty because all pods fail readiness probe at T0-12m"
  - from: StatefulSet/microservices/redis-cache
    relation: "Helm release managed object specification"
    to: HelmRelease/microservices/redis-cache
    fields: "HelmRelease.status.lastAppliedRevision vs StatefulSet.spec.template.spec.containers[].readinessProbe"
    abnormal: "Helm release applied chart version 3.2.1 containing invalid readinessProbe exec command at T0-30m"
decoys:
  - object: Deployment/microservices/api-gateway
    looks_like: "api-gateway replica count is scaled up by HPA"
    why_not: "HPA scaling is a response to error retries; the upstream dependency is what is failing."
  - object: Secret/microservices/redis-auth
    looks_like: "Redis authentication password secret modified recently"
    why_not: "Secret is unchanged; connection fails at TCP layer due to lack of healthy endpoints."
timeline:
  - "T0-30m: HelmRelease/redis-cache updated to version 3.2.1 with broken readiness probe."
  - "T0-12m: Redis pods marked unready by kubelet, removed from service endpoints."
  - "T0-10m: api-gateway logs connection refused errors."
  - "T0: Operator asks why api-gateway is failing health checks."
