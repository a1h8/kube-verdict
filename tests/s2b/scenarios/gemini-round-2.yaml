id: pdb-1
family: pdb
question: "why are node maintenance drains hanging in cluster for tenant namespace"
expected_outcome: cause
cause_object: PodDisruptionBudget/tenant/api-pdb
origin_object: PodDisruptionBudget/tenant/api-pdb
mechanism: "A PodDisruptionBudget was created with minAvailable set equal to the total replica count (2 out of 2), preventing node drains from evicting any pods because zero disruptions are permitted."
passes_if: "names PodDisruptionBudget/tenant/api-pdb or overly restrictive minAvailable configuration"
partial_if_only: ["PodDisruptionBudget/tenant/api-pdb"]
chain:
  - from: Node/ip-10-0-1-50.ec2.internal
    relation: "node cordon and drain eviction request"
    to: Pod/tenant/api-service-abc
    fields: "Node name vs Pod assigned nodeName and eviction API call"
    abnormal: "Eviction API call returns error: 'Cannot evict pod as it would violate the pod disruption budget's disruption budget.' at T0-15m"
  - from: Pod/tenant/api-service-abc
    relation: "pod disruption budget selector matching"
    to: PodDisruptionBudget/tenant/api-pdb
    fields: "Pod labels vs PodDisruptionBudget.spec.selector"
    abnormal: "PodDisruptionBudget status shows disruptionsAllowed: 0 because minAvailable (2) equals current healthy pods (2) at T0-15m"
decoys:
  - object: Deployment/tenant/api-service
    looks_like: "Deployment replica count is set to 2"
    why_not: "Replica count of 2 is correct, but combined with minAvailable: 2 in PDB, zero pods can be evicted during maintenance."
  - object: DaemonSet/kube-system/kube-proxy
    looks_like: "DaemonSet pods on node blocking drain"
    why_not: "DaemonSet pods are automatically ignored by node drain; the blocking object is the tenant PDB."
timeline:
  - "T0-1h: PodDisruptionBudget/api-pdb applied with minAvailable: 2 for a 2-replica deployment."
  - "T0-15m: Operator initiates node drain; eviction requests blocked by PDB disruptionsAllowed: 0."
