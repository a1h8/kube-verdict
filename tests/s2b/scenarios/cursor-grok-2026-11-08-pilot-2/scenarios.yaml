  - {kind: LimitRange, namespace: orders, name: storage, state: "PersistentVolumeClaim min 1Gi max 50Gi; the 20Gi claim is inside the range"}
  - {kind: PersistentVolumeClaim, namespace: analytics, name: warehouse-scratch, state: "Pending, WaitForFirstConsumer, 100Gi, storageClassName standard, no pod selected it"}
  - {kind: Deployment, namespace: analytics, name: worker, state: "2/2 Ready, emptyDir only, does not reference warehouse-scratch"}
