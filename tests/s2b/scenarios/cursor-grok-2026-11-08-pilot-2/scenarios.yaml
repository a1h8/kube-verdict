id: webhook-1
family: webhook
question: "why can't invoices roll out in billing"
expected_outcome: cause
cause_object: MutatingWebhookConfiguration/platform-pod-policy
origin_object: Namespace/billing
mechanism: "MutatingWebhookConfiguration/platform-pod-policy matches pod creates in namespaces labeled pod-policy=enforce and sets securityContext.runAsNonRoot, runAsUser 1000 and runAsGroup 1000. Namespace/billing gained that label at T0-35m. Invoices' image writes /var/lib/invoices as root and the new pods crash with permission denied. The webhook call succeeds, so this is a mutation, not an unavailable webhook. Pods created before the label have no such securityContext and stay Ready on the same image."
passes_if: "names MutatingWebhookConfiguration/platform-pod-policy as injecting runAsNonRoot and runAsUser 1000 into new billing pods because Namespace/billing is labeled pod-policy=enforce, which makes invoices CrashLoop with permission denied on /var/lib/invoices"
partial_if_only:
  - "new invoices pods crash with permission denied on /var/lib/invoices"
  - "those pods have securityContext.runAsUser 1000 and the Deployment template does not"
chain:
  - from: Deployment/billing/invoices
    relation: "label selector"
    to: Pod/billing/invoices-6b8d9c7f5-xk2pq
    fields: "Deployment.spec.selector.matchLabels app=invoices. Pod labels match. Template containers[0].name=invoices, image invoices:1.8.0, no securityContext on the pod or the container. Template annotation kubectl.kubernetes.io/restartedAt is T0-10m. strategy maxUnavailable 0."
    abnormal: "Pod created T0-10m, CrashLoopBackOff, restartCount 6. Log each start: ERROR cannot create /var/lib/invoices/queue: permission denied. Exit code 1. Live pod spec.securityContext.runAsNonRoot=true, runAsUser=1000, runAsGroup=1000. Sibling invoices-6b8d9c7f5-rr4nt is the same. Old pods invoices-5a4c3b2d1-old1, old2 and old3, image invoices:1.8.0, have no runAsUser, Ready since T0-2d. Deployment at T0: updatedReplicas 0, availableReplicas 3, Progressing False ProgressDeadlineExceeded at T0-0m."
  - from: Pod/billing/invoices-6b8d9c7f5-xk2pq
    relation: "mutating admission webhook whose namespaceSelector matches the pod's namespace and whose rules match pods on CREATE"
    to: MutatingWebhookConfiguration/platform-pod-policy
    fields: "webhooks[0].name=pod-policy.infra.example.com. namespaceSelector.matchLabels pod-policy=enforce matches Namespace/billing.metadata.labels pod-policy=enforce (also team=billing). rules[0] apiGroups [\"\"], apiVersions [v1], resources [pods], operations [CREATE], scope Namespaced. failurePolicy Fail. matchPolicy Equivalent. sideEffects None. clientConfig.service name=pod-policy, namespace=infra, port=443, path=/mutate. objectSelector is empty."
    abnormal: "The injected securityContext is not in the Deployment template. Loki log of container policy on Pod/infra/pod-policy-7f6c8d9e-a at T0-10m: mutate ns=billing pod=invoices-6b8d9c7f5-xk2pq: set securityContext.runAsNonRoot=true runAsUser=1000 runAsGroup=1000. The same line exists for rr4nt. There is no FailedCreate and no failed calling webhook event; the pods exist and then crash."
decoys:
  - object: Deployment/billing/invoices
    looks_like: "the rollout nearest the crash: invoices:1.8.0 is a bad image that cannot start"
    why_not: "the three pods of ReplicaSet/billing/invoices-5a4c3b2d1 run invoices:1.8.0 and are Ready, logging queue opened. They have no runAsUser. Only pods created after the namespace label, which carry the injected securityContext, log permission denied"
  - object: Deployment/infra/pod-policy
    looks_like: "the admission webhook is down and failurePolicy Fail is blocking the rollout"
    why_not: "webhook pods have been 2/2 Ready since T0-5h. New invoices pods were admitted and created, which a failed call with failurePolicy Fail would not do. The policy container logs a successful mutate at T0-10m. Alert WebhookUnavailable ended at T0-5h and is not firing"
  - object: Deployment/billing/invoices
    looks_like: "helm value runAsUser 1000 was applied to the workload"
    why_not: "Helm release invoices values set podSecurityContext null, and the live Deployment template has no securityContext. The field exists only on pods created after admission. Ledger in the same namespace, which already set runAsUser 1000 in its own template, rolled successfully at T0-30m and is Ready"
timeline:
  - "T0-6h: Pods of Deployment/infra/pod-policy NotReady. Alert WebhookUnavailable fired. No billing pods were being created then"
  - "T0-5h: Deployment/infra/pod-policy 2/2 Ready. Alert WebhookUnavailable ended"
  - "T0-2d: ReplicaSet invoices-5a4c3b2d1 pods created, no runAsUser, image invoices:1.8.0, still Ready at T0"
  - "T0-35m: Namespace/billing label pod-policy=enforce added. The MutatingWebhookConfiguration was not edited"
  - "T0-30m: Deployment/billing/ledger rolled, webhook set the same securityContext the template already had, ledger reached 2/2 Ready"
  - "T0-10m: invoices restarted with kubectl.kubernetes.io/restartedAt. Image unchanged. New ReplicaSet invoices-6b8d9c7f5 created two pods. Webhook mutate log at T0-10m"
  - "T0-9m: invoices containers exit 1, permission denied on /var/lib/invoices/queue, then CrashLoopBackOff through T0"
  - "T0: Deployment progress deadline exceeded. Old three pods Ready. New two pods CrashLoopBackOff. Webhook service Ready"
