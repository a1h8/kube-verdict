id: configmap-1
family: configmap
question: "why is the storefront returning errors in edge"
expected_outcome: cause
cause_object: ConfigMap/edge/gateway-nginx
origin_object: ConfigMap/edge/gateway-nginx
mechanism: "Ingress/edge/storefront sends / to Service/edge/gateway. The gateway pods mount ConfigMap/edge/gateway-nginx key upstream.conf and nginx reloaded it in place at T0-11m. proxy_pass now uses port 8081. Service/shop/checkout and its pods listen on 8080, so nginx gets connection refused and returns 502. Checkout is Ready and is not receiving these requests."
passes_if: "names ConfigMap/edge/gateway-nginx key upstream.conf proxy_pass port 8081, which does not match Service/shop/checkout port 8080, so the gateway returns 502 after reloading that file"
partial_if_only:
  - "gateway pods log connection refused to an upstream on port 8081 and return 502"
  - "Service/shop/checkout is Ready on port 8080"
chain:
  - from: Ingress/edge/storefront
    relation: "Ingress backend service"
    to: Service/edge/gateway
    fields: "Ingress.spec.rules[0].host=storefront.example.com, paths[0].path=/, pathType Prefix, backend.service.name=gateway, backend.service.port.number=80. Service spec.ports[0].port=80, name http, targetPort name http. Selector app=gateway."
    abnormal: "Alert Gateway5xxHigh, namespace=edge, service=gateway, firing since T0-11m. Ingress events are only Normal Sync from the ingress controller at T0-11m, not an error. The Ingress object was not edited."
  - from: Service/edge/gateway
    relation: "Service selector"
    to: Pod/edge/gateway-5d6e7f8a9-b1c2d
    fields: "Service.spec.selector app=gateway matches this pod and gateway-5d6e7f8a9-c3d4e. Container port name http, containerPort 8080, which is what Service port 80 targets. Pods started at T0-8h, restartCount 0."
    abnormal: "Nginx error log since T0-11m: connect() failed (111: Connection refused) while connecting to upstream, upstream: \"http://10.8.2.14:8081/api/checkout\". Access log status 502 for GET /api/checkout. At T0-11m a notice line says config file /etc/nginx/conf.d/upstream.conf changed, reloading, then signal process started. No container restart."
  - from: Pod/edge/gateway-5d6e7f8a9-b1c2d
    relation: "volume projected from a ConfigMap"
    to: ConfigMap/edge/gateway-nginx
    fields: "Pod.spec.volumes[name=nginx-conf].configMap.name=gateway-nginx, items key upstream.conf path upstream.conf and key server.conf path server.conf. volumeMounts mountPath=/etc/nginx/conf.d, no subPath. ConfigMap.data[upstream.conf] contains proxy_pass http://checkout.shop.svc.cluster.local:8081; . ConfigMap.data[server.conf] contains the server listen 8080 and the include of upstream.conf."
    abnormal: "The upstream.conf key has had port 8081 since the T0-12m edit. Checkout's Service port is 8080 (next object, not the fault). The reload notice quotes the mounted path of this key."
decoys:
  - object: Service/shop/checkout
    looks_like: "the upstream named in the 502s is down, so checkout is the failure"
    why_not: "selector app=checkout matches three Ready pods, containerPort 8080 named http, Service port 8080 targetPort http. Checkout access log has no request from the gateway since T0-12m and shows normal local probes returning 200 at T0-2m. The refused port in the gateway log is 8081, which this Service does not listen on"
  - object: Deployment/edge/gateway
    looks_like: "the 502s come from a bad gateway image or a crash"
    why_not: "both pods have been Running since T0-8h, restartCount 0, image gateway-nginx:1.25.4. The process reloaded config without exiting. From T0-8h until T0-11m the same pods logged successful upstreams to checkout.shop.svc.cluster.local:8080"
  - object: ConfigMap/edge/gateway-nginx
    looks_like: "server.conf keepalive_timeout 75s differs from the chart value 65s and is a bad config push"
    why_not: "that key is mounted, but the error log is connection refused to port 8081, not a keepalive timeout. Requests fail in a few milliseconds. The 75s value was already in revision 40, during the hours the gateway returned 200s"
timeline:
  - "T0-9h: gateway pods CrashLoopBackOff on a syntax error in upstream.conf. Alert GatewayCrashLoop fired"
  - "T0-8h: Helm release edge-gateway revision 40 restored a valid upstream.conf with proxy_pass port 8080. Pods started, restartCount still 0 at T0. Alert GatewayCrashLoop ended. Access log 200s to checkout:8080"
  - "T0-12m: Helm release edge-gateway revision 41 changed only ConfigMap/edge/gateway-nginx data.upstream.conf proxy_pass port from 8080 to 8081. The Deployment template was not changed, so pods were not rolled"
  - "T0-11m: nginx notice, upstream.conf changed, reloading. Error log connection refused to :8081 begins. Alert Gateway5xxHigh firing. Ingress Normal Sync only"
  - "T0-2m: checkout pods log 200 on their own readiness probes and no gateway requests"
  - "T0: gateway pods still the T0-8h processes; ConfigMap upstream.conf still port 8081; checkout Ready on 8080"
