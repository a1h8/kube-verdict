id: hpa-1
family: hpa
question: "why is search slow in shop"
expected_outcome: cause
cause_object: HorizontalPodAutoscaler/shop/search
origin_object: Deployment/shop/search
mechanism: "Search latency is high because the Deployment stays at 2 replicas. Its HorizontalPodAutoscaler uses a ContainerResource cpu metric for a container named application. The Deployment's only container was renamed to search at T0-40m and the HPA was not updated, so every pod is missing that container in the metrics and ScalingActive is False. The controller keeps the last scale, which is minReplicas 2, through the traffic that started at T0-18m."
passes_if: "names HorizontalPodAutoscaler/shop/search containerResource container application, which does not exist on Deployment/shop/search (container name search), so the HPA cannot compute a scale and search stays at 2 replicas"
partial_if_only:
  - "search is slow while Service/shop/search has only two Ready pods"
  - "Deployment/shop/search did not add replicas after the latency alert"
chain:
  - from: Ingress/shop/web
    relation: "Ingress backend service"
    to: Service/shop/search
    fields: "Ingress.spec.rules[0].host=search.example.com, http.paths[0].path=/ , pathType Prefix, backend.service.name=search, backend.service.port.number=80. Service.metadata.name=search, namespace shop, spec.ports[0].port=80, targetPort name http."
    abnormal: "Prometheus alert SearchLatencyHigh, namespace=shop, service=search, is firing since T0-18m, p99 above 2s. The Ingress has no warning events. Its address is assigned."
  - from: Service/shop/search
    relation: "Service selector"
    to: Pod/shop/search-7c8f9d6b4-a1b2c
    fields: "Service.spec.selector app=search, component=http matches the pod and the sibling search-7c8f9d6b4-d4e5f. Both containers are named search, port name http, containerPort 8080."
    abnormal: "Only these two pods are Ready. Since T0-18m they log in_flight=180, rejecting with 503 once the queue passes 200. They are not restarting. CPU throttling is present on container search; the replica count does not change."
  - from: Pod/shop/search-7c8f9d6b4-a1b2c
    relation: "controller ownerReference"
    to: ReplicaSet/shop/search-7c8f9d6b4
    fields: "Pod.metadata.ownerReferences[0] is apps/v1 ReplicaSet search-7c8f9d6b4, controller true. ReplicaSet.spec.replicas=2, status.readyReplicas=2. Pod template container name is search."
    abnormal: "The set has been at 2/2 since the rollout at T0-40m. No FailedCreate. Pods are Ready, so this set is not stuck creating pods."
  - from: ReplicaSet/shop/search-7c8f9d6b4
    relation: "controller ownerReference"
    to: Deployment/shop/search
    fields: "ReplicaSet.metadata.ownerReferences[0] is apps/v1 Deployment search, controller true. Deployment.spec.replicas=2. Deployment.spec.selector.matchLabels app=search, component=http. Template containers[0].name=search, resources.requests.cpu=200m, limits.cpu=1."
    abnormal: "Deployment availableReplicas 2, updatedReplicas 2. No progress deadline. Observed slowness is the alert and the pod reject log, not a failed rollout."
  - from: Deployment/shop/search
    relation: "HorizontalPodAutoscaler scaleTargetRef"
    to: HorizontalPodAutoscaler/shop/search
    fields: "HPA.spec.scaleTargetRef.apiVersion=apps/v1, kind=Deployment, name=search. spec.minReplicas=2, spec.maxReplicas=20. spec.metrics[0].type=ContainerResource, containerResource.name=cpu, containerResource.container=application, target.type=Utilization, target.averageUtilization=60. The Deployment container name is search, not application. No pod template container is named application."
    abnormal: "HPA status.desiredReplicas=2, currentReplicas=2, lastScaleTime T0-3h. Condition AbleToScale True, SucceededGetScale. Condition ScalingActive False, reason FailedGetContainerResourceMetric, message: the HPA was unable to compute the replica count: failed to get cpu utilization: unable to get metric cpu: failed to get container metrics: container application not present in metrics for pod shop/search-7c8f9d6b4-a1b2c. Event Warning FailedGetContainerResourceMetric horizontal-pod-autoscaler with that text, first at T0-39m and still repeating at T0. No SuccessfulRescale since T0-3h."
decoys:
  - object: Deployment/shop/search
    looks_like: "the slow pods themselves: CPU throttling and 503s, so the cpu limit 1 is too small or the image is bad"
    why_not: "both pods are Ready and the limit has been 1 for weeks, including the T0-3h scale-down when latency was fine. The HPA target is 60% of the 200m request, which is what would add replicas. ScalingActive is false because the metric container name does not exist, not because metrics-server returned empty usage"
  - object: Deployment/kube-system/metrics-server
    looks_like: "HPA cannot scale because the metrics pipeline is down"
    why_not: "metrics-server is 2/2 Ready, startTime T0-5h. Alert MetricsServerDown fired at T0-6h and ended at T0-5h. The HPA error text is container application not present in metrics for a named pod, not no metrics returned from resource metrics API. A SuccessfulRescale happened at T0-3h, after metrics-server recovered and before the rename"
  - object: Deployment/shop/search
    looks_like: "chart replicaCount 6 disagrees with spec.replicas 2, so the live deployment drifted too low"
    why_not: "Helm release search revision 22 set the container name and did not change replicaCount; the live spec.replicas is 2 because the HPA scaled it there at T0-3h and wrote spec.replicas, which is normal while an HPA exists. Putting 6 in the chart would not clear FailedGetContainerResourceMetric, and the HPA would set the replica count again if the metric worked"
timeline:
  - "T0-6h: alert MetricsServerDown fired. HPA events at that time were no metrics returned from resource metrics API"
  - "T0-5h: Deployment/kube-system/metrics-server 2/2 Ready. Alert MetricsServerDown ended"
  - "T0-3h: HPA event Normal SuccessfulRescale horizontal-pod-autoscaler New size: 2; reason: cpu resource utilization (percentage of request) below target. Container name was still application. Latency alert was not firing"
  - "T0-40m: Helm release search revision 22 rolled Deployment/shop/search and renamed containers[0] from application to search. Requests and the image tag search:5.4.0 stayed. The HPA object was not in that release and was not edited"
  - "T0-39m: FailedGetContainerResourceMetric begins, container application not present, and repeats through T0. desiredReplicas stays 2"
  - "T0-18m: alert SearchLatencyHigh firing. Search pods log in_flight 180 and 503s. Replica count stays 2"
  - "T0: Ingress healthy, two search pods Ready, HPA ScalingActive False, maxReplicas 20 unused"
