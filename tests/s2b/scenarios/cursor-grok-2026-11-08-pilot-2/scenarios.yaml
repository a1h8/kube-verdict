  - {kind: PersistentVolume, namespace: "", name: pvc-orders-db-prev, state: "Released, claimRef orders/data-orders-db-old, capacity 20Gi, no pod references it"}
  - {kind: Service, namespace: orders, name: orders-db, state: "ClusterIP port 5432, selector app=orders-db, the Ready pod is the backend"}
  - {kind: ConfigMap, namespace: orders, name: orders-db, state: "max_connections=100, mounted; postmaster is up"}
  - {kind: ServiceAccount, namespace: orders, name: orders-db, state: "used by the StatefulSet"}
  - {kind: Deployment, namespace: orders, name: api, state: "3/3 Ready, connects to orders-db and logs queries succeeding at T0-1m"}
  - {kind: Service, namespace: orders, name: api, state: "ClusterIP port 8080, three ready pods"}
  - {kind: HorizontalPodAutoscaler, namespace: orders, name: api, state: "min 2 max 8, current 3, ScalingActive True, cpu 28% of target 65"}
  - {kind: PodDisruptionBudget, namespace: orders, name: api, state: "minAvailable 2, disruptionsAllowed 1"}
  - {kind: Ingress, namespace: orders, name: api, state: "host orders.example.com to service api port 8080"}
  - {kind: ConfigMap, namespace: orders, name: api, state: "DATABASE_HOST=orders-db.orders.svc, mounted; api Ready"}
  - {kind: NetworkPolicy, namespace: orders, name: db-ingress, state: "allows TCP 5432 to app=orders-db from pods labeled app=api in the same namespace"}
