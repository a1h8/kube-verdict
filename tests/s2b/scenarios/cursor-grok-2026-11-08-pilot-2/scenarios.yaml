id: pdb-1
family: pdb
question: "why is node ip-10-0-3-27 stuck draining"
expected_outcome: cause
cause_object: PodDisruptionBudget/batch/indexer
origin_object: Job/batch/indexer
mechanism: "The drain evicts Ready indexer pods that sit on the node. PodDisruptionBudget/batch/indexer sets minAvailable to 80%. expectedPods is 10 because the selector also matches two Pending pods, so desiredHealthy is 8, currentHealthy is 8 and disruptionsAllowed is 0. The eviction API refuses the Ready pods. Those two Pending pods exist because Job parallelism went from 8 to 10 at T0-25m and the extras cannot schedule."
passes_if: "names PodDisruptionBudget/batch/indexer minAvailable 80% and that expectedPods counts two Pending indexer pods so desiredHealthy equals the 8 Ready pods and disruptionsAllowed is 0, which denies eviction on ip-10-0-3-27"
partial_if_only:
  - "node ip-10-0-3-27 is cordoned and ScaleDownFailed"
  - "indexer pods are Pending with Insufficient cpu"
chain:
  - from: Node/ip-10-0-3-27
    relation: "pods bound to the node"
    to: Pod/batch/indexer-3
    fields: "Pod.spec.nodeName=ip-10-0-3-27 and Node.metadata.name is that node. Pods indexer-4 and indexer-5 also have this nodeName. All three are phase Running, Ready True, labels job=indexer, component=executor. The node spec.unschedulable is true and it has taint node.kubernetes.io/unschedulable."
    abnormal: "None of the three pods has deletionTimestamp or a finalizer. Event on the node, T0-2m, Warning ScaleDownFailed cluster-autoscaler: failed to drain the node, aborting. Reason: Cannot evict pod as it would violate the pod's disruption budget. (pod batch/indexer-3). The same event names indexer-4 and indexer-5 on the retries at T0-1m and T0. Loki on Deployment/ops/cluster-autoscaler repeats that API error."
  - from: Pod/batch/indexer-3
    relation: "PodDisruptionBudget selector"
    to: PodDisruptionBudget/batch/indexer
    fields: "PDB.spec.selector.matchLabels job=indexer, component=executor matches indexer-3 and the other indexer executor pods. spec.minAvailable is the string 80%. status.expectedPods=10, status.currentHealthy=8, status.desiredHealthy=8, status.disruptionsAllowed=0. status.observedGeneration matches the PDB generation."
    abnormal: "disruptionsAllowed 0 at T0. The eight Running Ready pods are currentHealthy. Pod/batch/indexer-8 and Pod/batch/indexer-9 are phase Pending, so they are in expectedPods and not in currentHealthy. Their events, T0-25m and still true: Warning FailedScheduling default-scheduler 0/6 nodes are available: 6 Insufficient cpu. They have no nodeName."
decoys:
  - object: Pod/batch/indexer-3
    looks_like: "the pod on the node is stuck terminating or held by a finalizer, which is the nearest object to a failed drain"
    why_not: "metadata.deletionTimestamp is unset and metadata.finalizers is empty. The container is Ready. The ScaleDownFailed event is the eviction API refusing the pod, so the drain never deleted it"
  - object: Pod/batch/indexer-8
    looks_like: "the node cannot drain because the cluster is out of CPU, FailedScheduling Insufficient cpu"
    why_not: "indexer-8 and indexer-9 are the pods that cannot be placed. They are not on ip-10-0-3-27. The pods the autoscaler is trying to evict are Ready. The drain error text is the disruption budget, not FailedScheduling. The Pending pods matter only because this PDB's percentage counts them in expectedPods"
  - object: Node/ip-10-0-3-27
    looks_like: "DiskPressure left the node undrainable"
    why_not: "condition DiskPressure was True from T0-4h to T0-3h and is False at T0, lastTransitionTime T0-3h. Ready is True. The cordon unschedulable=true started at T0-15m with the scale-down, after DiskPressure had cleared. No eviction was in progress during DiskPressure"
timeline:
  - "T0-4h: Node/ip-10-0-3-27 DiskPressure True"
  - "T0-3h: Node/ip-10-0-3-27 DiskPressure False, Ready True, lastTransitionTime T0-3h. The node was schedulable"
  - "T0-2h: Job/batch/indexer running with parallelism 8, eight Ready pods, PDB expectedPods 8, desiredHealthy 7, disruptionsAllowed 1"
  - "T0-25m: Job/batch/indexer spec.parallelism and completions edited from 8 to 10. indexer-8 and indexer-9 created and Pending, FailedScheduling Insufficient cpu. PDB expectedPods 10, desiredHealthy 8, currentHealthy 8, disruptionsAllowed 0"
  - "T0-15m: cluster-autoscaler cordoned Node/ip-10-0-3-27, spec.unschedulable true, and started a drain"
  - "T0-2m: Node event Warning ScaleDownFailed, Cannot evict pod as it would violate the pod's disruption budget, pod batch/indexer-3. Retries at T0-1m and T0 name indexer-4 and indexer-5"
  - "T0: node still unschedulable; three Ready indexer pods remain on it; PDB disruptionsAllowed 0; indexer-8 and indexer-9 still Pending"
