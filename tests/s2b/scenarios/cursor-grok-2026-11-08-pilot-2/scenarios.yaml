id: storage-0
family: storage
question: "is something wrong with the orders volume in orders"
expected_outcome: no_incident
mechanism: "At T0 the orders database volume is fine. PVC/orders/data-orders-db-0 is Bound to PV/pvc-orders-db-0 and mounted by the Ready pod of StatefulSet/orders/orders-db, which is serving. PV/pvc-orders-db-prev is Released from an old claim that no pod mounts. PVC/analytics/warehouse-scratch is Pending only because it is WaitForFirstConsumer and no pod references it. The chart's 50Gi size is not what is applied; the live claim is 20Gi and the pod is healthy with no disk alert firing. A filling-up alert on the live volume ended at T0-7h."
passes_if: "states that there is no incident and names no fault"
partial_if_only:
  - "PV/pvc-orders-db-prev is Released"
  - "PVC/analytics/warehouse-scratch is Pending"
chain: []
decoys:
  - object: PersistentVolume/pvc-orders-db-prev
    looks_like: "a Released volume means the orders data was lost"
    why_not: "status.phase is Released and spec.claimRef names orders/data-orders-db-old, a claim that is gone. No pod volume references this PV. StatefulSet/orders/orders-db mounts claimName data-orders-db-0 only. That claim is Bound and the database pod is Ready, logging checkpoint complete at T0-2m"
  - object: PersistentVolumeClaim/analytics/warehouse-scratch
    looks_like: "a Pending PVC means storage is broken for the cluster, including orders"
    why_not: "it is in namespace analytics, spec.storageClassName standard, phase Pending, event Normal WaitForFirstConsumer from T0-1d, and no Pod in any namespace references it. Orders uses a different claim that is already Bound. Nothing is trying to schedule a pod onto the scratch claim"
  - object: StatefulSet/orders/orders-db
    looks_like: "helm persistence.size 50Gi disagrees with the live 20Gi claim, so the database is on the wrong disk"
    why_not: "the live StatefulSet volumeClaimTemplates request and the PVC request are both 20Gi, and they match PV capacity 20Gi. The chart value 50Gi was never applied; helm release orders-db revision 4 is two weeks old and matches the live 20Gi. No resize is in progress. Alert KubePersistentVolumeFillingUp ended at T0-7h and is not firing"
timeline:
  - "T0-14d: PVC/orders/data-orders-db-0 Bound to PV/pvc-orders-db-0 at 20Gi. StatefulSet orders-db has been Ready on it since"
  - "T0-14d: PV/pvc-orders-db-prev left Released after claim data-orders-db-old was removed; no pod has referenced it since"
  - "T0-8h: alert KubePersistentVolumeFillingUp fired for orders/data-orders-db-0"
  - "T0-7h: alert KubePersistentVolumeFillingUp ended after the database compacted. It is not firing at T0"
  - "T0-1d: PVC/analytics/warehouse-scratch created and has stayed Pending WaitForFirstConsumer, unused"
  - "T0-2m: orders-db-0 log checkpoint complete"
  - "T0: orders-db 1/1 Ready, PVC Bound, no storage alert firing"
objects:
  - {kind: Namespace, namespace: "", name: orders, state: "Active, labels team=orders"}
  - {kind: Namespace, namespace: "", name: analytics, state: "Active, labels team=analytics"}
  - {kind: Node, namespace: "", name: ip-10-0-7-2, state: "Ready, DiskPressure False"}
  - {kind: Node, namespace: "", name: ip-10-0-7-3, state: "Ready, DiskPressure False"}
  - {kind: StatefulSet, namespace: orders, name: orders-db, state: "1/1 Ready, volumeClaimTemplates 20Gi claim data, mounted at /var/lib/postgresql/data"}
