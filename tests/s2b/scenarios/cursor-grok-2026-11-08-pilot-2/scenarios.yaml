id: pullsecret-0
family: pullsecret
question: "why can't checkout pull its image in shop"
expected_outcome: no_incident
mechanism: "At T0 checkout is not failing to pull. The running pods record a kubelet warning that expired-regcred could not be retrieved and, in the same minute, a Pulled event for registry.example.com/shop/checkout:2.3.1; the containers are Ready. ServiceAccount/shop/checkout lists that extra name while the chart lists only regcred, and the pull still completed. An image-pull alert for a Job in lab fired earlier and has ended; that Job is Complete."
passes_if: "states that there is no incident and names no fault"
partial_if_only:
  - "checkout pods emitted FailedToRetrieveImagePullSecret for expired-regcred"
  - "a pull alert fired for a Job in lab"
chain: []
decoys:
  - object: Pod/shop/checkout-6c8d9e7f5-k3mqa
    looks_like: "FailedToRetrieveImagePullSecret means checkout cannot pull its image"
    why_not: "the same pod has event Normal Pulled kubelet Successfully pulled image registry.example.com/shop/checkout:2.3.1 in 842ms at T0-20m, after the warning at T0-20m. The container is Ready, restartCount 0, and all three checkout pods are the same. Deployment updatedReplicas is 3 of 3"
  - object: Job/lab/experiment-28900
    looks_like: "an image pull failure is still going on in the cluster"
    why_not: "alert KubePodImagePullBackOff for namespace lab, pod experiment-28900-x, fired at T0-2h and ended at T0-90m. The Job status is Complete, succeeded 1, completionTime T0-90m. No pull alert is firing at T0, and the Job is not checkout"
  - object: ServiceAccount/shop/checkout
    looks_like: "live imagePullSecrets [regcred, expired-regcred] drift from the chart's [regcred], so credentials are wrong"
    why_not: "the extra name is what the warning mentions, and the following Pulled event shows the image was retrieved. The pods have been Ready since T0-20m. The drift does not leave checkout unable to run"
timeline:
  - "T0-2h: alert KubePodImagePullBackOff fired for lab/experiment-28900-x"
  - "T0-90m: Job/lab/experiment-28900 succeeded. The alert ended"
  - "T0-20m: ReplicaSet checkout-6c8d9e7f5 created three pods. Each has Warning FailedToRetrieveImagePullSecret kubelet Unable to retrieve some image pull secrets (expired-regcred); attempting to pull the image may not succeed. Each then has Normal Pulled for checkout:2.3.1"
  - "T0-20m: all three containers started and are still Ready at T0, restartCount 0"
  - "T0: Deployment/shop/checkout 3/3 Ready, no pull alert firing"
