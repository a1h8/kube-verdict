  - {kind: DaemonSet, namespace: orders, name: backup-agent, state: "2/2 Ready, does not mount the database PVC"}
  - {kind: ServiceAccount, namespace: orders, name: api, state: "no imagePullSecrets"}
  - {kind: HorizontalPodAutoscaler, namespace: analytics, name: worker, state: "current 2, ScalingActive True"}
