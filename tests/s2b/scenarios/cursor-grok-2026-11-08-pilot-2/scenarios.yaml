id: ingress-0
family: ingress
question: "why is storefront slow in shop"
expected_outcome: no_incident
mechanism: "At T0 storefront is not slow and nothing is failing. Deployment/shop/storefront is 12/12 Ready, Ingress/shop/storefront has an assigned address and only Normal Sync events, and no latency or 5xx alert is firing. The HPA holding 12 replicas is inside its maximum and under its CPU target. A 5xx alert and an ingress-controller restart earlier in the day have both ended. The canary Service has no pods, and the canary annotation weight is 0, so it takes no traffic. The live proxy-body-size differs from the chart and there is no 413 in the log. Ingress/marketing/landing is serving 200s."
passes_if: "states that there is no incident and names no fault"
partial_if_only:
  - "storefront is running 12 replicas"
  - "a 5xx alert fired earlier and the canary service has no pods"
chain: []
decoys:
  - object: HorizontalPodAutoscaler/shop/storefront
    looks_like: "twelve replicas is a runaway scale and explains a slow or overloaded storefront"
    why_not: "maxReplicas is 30, desiredReplicas is 12, cpu is 48% against target 70, ScalingActive True, ScalingLimited False. No storefront latency alert is firing. The count is the healthy result of an earlier traffic peak, not a stuck scaler"
  - object: Service/shop/storefront-canary
    looks_like: "the Ingress points at a canary Service with zero pods, so users hit a dead backend"
    why_not: "Ingress annotation nginx.ingress.kubernetes.io/canary is true on Ingress/shop/storefront-canary and nginx.ingress.kubernetes.io/canary-weight is 0. The main Ingress/shop/storefront backend is Service/shop/storefront, which has 12 Ready pods. Gateway access log at T0-1m is status 200 for host storefront.example.com and names upstream port 8080 on those pods"
  - object: Deployment/edge/nginx
    looks_like: "the ingress controller crashed and storefront is still affected"
    why_not: "one container restart finished at T0-4h; both pods have been Ready since T0-3h50m. Alert NGINXControllerDown ended at T0-3h50m. Alert NGINXIngress5xx ended at T0-2h40m. Neither is firing at T0"
timeline:
  - "T0-4h: one container of Deployment/edge/nginx restarted. Alert NGINXControllerDown fired"
  - "T0-3h50m: Deployment/edge/nginx 2/2 Ready. Alert NGINXControllerDown ended"
  - "T0-3h: alert NGINXIngress5xx fired for host storefront.example.com during that restart window"
  - "T0-2h40m: alert NGINXIngress5xx ended. Access log since then is 200s"
  - "T0-1h: HPA/shop/storefront scaled to 12 on cpu. At T0 cpu is 48% of a 70% target and the replica count has not moved; scaleDown stabilization is 300s and the metric is still inside the tolerance the controller is not acting on"
  - "T0-1m: gateway access log 200 for storefront.example.com"
  - "T0: 12/12 storefront pods Ready, no storefront alert firing, canary weight 0, Ingress address assigned"
objects:
