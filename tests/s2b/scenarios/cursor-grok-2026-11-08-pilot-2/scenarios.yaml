---
id: netpol-1
family: netpol
question: "why is checkout failing in shop"
expected_outcome: cause
cause_object: NetworkPolicy/shop/checkout-egress
origin_object: Namespace/data
mechanism: "NetworkPolicy/shop/checkout-egress selects checkout pods and sets Egress, so those pods may open only the listed flows. DNS to kube-system still matches, but TCP 5432 is allowed only to pods labeled app=postgres in a namespace labeled purpose=datastore. Namespace/data lost that label at T0-22m, so the peer no longer matches Pod/data/postgres-0 and new connections time out. Postgres itself is Ready and accepts connections from pods the policy does not select."
passes_if: "names NetworkPolicy/shop/checkout-egress and says its egress peer namespaceSelector purpose=datastore no longer matches Namespace/data, so checkout pods are denied TCP 5432 to postgres while DNS still works"
partial_if_only:
  - "checkout pods log dial tcp timeouts to postgres port 5432"
  - "Service/data/postgres and Pod/data/postgres-0 are Ready"
chain:
  - from: Deployment/shop/checkout
    relation: "label selector of the workload the question names"
    to: Pod/shop/checkout-6c8d9e7f5-k3mqa
    fields: "Deployment.spec.selector.matchLabels app=checkout, component=api. The same labels are on the pod and on the two sibling pods checkout-6c8d9e7f5-p8nrd and checkout-6c8d9e7f5-w1hts. All three use container env DATABASE_URL=postgres://payments@postgres.data.svc.cluster.local:5432/payments."
    abnormal: "Since T0-21m each pod logs dial tcp 10.42.8.21:5432: i/o timeout. Readiness /healthz, which checks the database, fails. At T0 Ready is False, reason ContainersNotReady. OpenTelemetry span pg.query from service checkout is ERROR with that timeout, peer postgres.data.svc:5432. Prometheus alert CheckoutHighErrorRate, namespace=shop, service=checkout, is firing since T0-20m."
  - from: Pod/shop/checkout-6c8d9e7f5-k3mqa
    relation: "NetworkPolicy podSelector isolates the pod for egress"
    to: NetworkPolicy/shop/checkout-egress
    fields: "Pod.metadata.labels app=checkout (component=api does not matter). NetworkPolicy.spec.podSelector.matchLabels app=checkout. spec.policyTypes contains Egress. No other NetworkPolicy in shop selects these pods and lists Egress."
    abnormal: "The pod is egress-isolated. Its only 5432 rule does not match a live peer (next hop). Connections to port 53 still succeed: the pods resolve postgres.data.svc to 10.42.8.21, which is Pod/data/postgres-0 status.podIP."
  - from: NetworkPolicy/shop/checkout-egress
    relation: "egress peer: namespaceSelector and podSelector in one list item, AND-combined, plus the port"
    to: Namespace/data
    fields: "NetworkPolicy.spec.egress[1].to[0].namespaceSelector.matchLabels purpose=datastore and, in the same list item, podSelector.matchLabels app=postgres, ports TCP 5432. Namespace/data.metadata.labels is only team=data (plus the default kubernetes.io/metadata.name=data). It has no purpose key. Pod/data/postgres-0.metadata.labels app=postgres, namespace data, containerPort 5432."
    abnormal: "At T0 the namespace label the selector requires is absent, so this peer is empty. Pod/data/postgres-0 is Running and Ready. Pod/shop/net-debug, which is not labeled app=checkout and is not selected, logged at T0-5m: pg_isready -h postgres.data.svc -p 5432: accepting connections."
decoys:
  - object: Service/data/postgres
    looks_like: "the dependency nearest the timeouts: checkout names postgres.data.svc:5432 and then fails"
    why_not: "selector app=postgres matches Pod/data/postgres-0, Ready True, podIP 10.42.8.21, containerPort 5432 named postgres. It accepts sessions from shop/net-debug at T0-5m. The checkout timeout is after DNS resolution, and only pods selected by checkout-egress are affected"
  - object: Pod/data/postgres-0
    looks_like: "a database pod that crashed earlier and is still the outage"
    why_not: "restartCount 1, lastState.terminated.reason Error, finishedAt T0-5h. The current container has been Ready since T0-5h. Alert PostgresDown ended at T0-5h. That is before checkout's first timeout at T0-21m. Postgres log at T0-5m records the net-debug session"
  - object: NetworkPolicy/shop/checkout-ingress
    looks_like: "a second policy on the same pods, easy to read as a total lockout"
    why_not: "spec.policyTypes is only Ingress. spec.ingress allows TCP 8080 from namespaces labeled role=edge. It does not change egress. User requests still reach the pods; the failures are the pods' own dials to port 5432"
timeline:
  - "T0-10d: NetworkPolicy/shop/checkout-egress last applied; spec unchanged since"
  - "T0-5h: Pod/data/postgres-0 container exited Error and the kubelet restarted it. Alert PostgresDown fired"
  - "T0-5h: Pod/data/postgres-0 Ready True again. Alert PostgresDown ended"
  - "T0-22m: Namespace/data label purpose=datastore removed. Remaining labels are team=data. The NetworkPolicy object was not edited"
  - "T0-21m: checkout pods start logging dial tcp 10.42.8.21:5432 i/o timeout. DNS still returns that address"
  - "T0-20m: alert CheckoutHighErrorRate starts firing. Checkout readiness goes False"
  - "T0-5m: Pod/shop/net-debug pg_isready to postgres.data.svc:5432 succeeds. Postgres log records that session and no session from the checkout pods since T0-21m"
  - "T0: three checkout pods Running, not Ready; postgres Ready; Namespace/data has no purpose label; the egress policy is unchanged"
objects:
  - {kind: Namespace, namespace: "", name: shop, state: "Active, labels team=shop and role=app"}
  - {kind: Namespace, namespace: "", name: data, state: "Active, labels team=data only; purpose was removed at T0-22m"}
  - {kind: Namespace, namespace: "", name: edge, state: "Active, labels role=edge and team=edge"}
  - {kind: Namespace, namespace: "", name: kube-system, state: "Active, label kubernetes.io/metadata.name=kube-system"}
  - {kind: Node, namespace: "", name: ip-10-0-4-11, state: "Ready"}
  - {kind: Node, namespace: "", name: ip-10-0-4-12, state: "Ready"}
  - {kind: Node, namespace: "", name: ip-10-0-4-18, state: "Ready"}
  - {kind: Deployment, namespace: shop, name: catalog, state: "4/4 Ready, image catalog:3.3.1, not selected by checkout-egress"}
  - {kind: Service, namespace: shop, name: catalog, state: "ClusterIP port 8080, four ready pods"}
  - {kind: Deployment, namespace: shop, name: cart, state: "3/3 Ready; calls catalog in-namespace, not postgres"}
  - {kind: Service, namespace: shop, name: cart, state: "ClusterIP port 8080, three ready pods"}
  - {kind: ConfigMap, namespace: shop, name: checkout-flags, state: "CHECKOUT_TAX=on, unchanged for 9d; checkout logs still reach the dial, so the process starts"}
  - {kind: ServiceAccount, namespace: shop, name: checkout, state: "no extra secrets referenced; pods are created normally"}
  - {kind: HorizontalPodAutoscaler, namespace: shop, name: checkout, state: "min 3 max 12, current 3, ScalingActive True, cpu metric unknown while pods are unready, ScalingLimited False; replica count is not the failure"}
  - {kind: PodDisruptionBudget, namespace: shop, name: checkout, state: "minAvailable 2, currentHealthy 0 because readiness is false, disruptionsAllowed 0; nobody is draining"}
  - {kind: Pod, namespace: shop, name: net-debug, state: "Running, labels app=net-debug, not selected by checkout-egress; pg_isready succeeded at T0-5m"}
  - {kind: Service, namespace: shop, name: checkout, state: "ClusterIP port 8080, selector app=checkout,component=api; all three pods not Ready"}
  - {kind: ReplicaSet, namespace: shop, name: checkout-6c8d9e7f5, state: "3 desired, 3 Running, 0 Ready, image checkout:2.3.1 unchanged for 3d"}
  - {kind: StatefulSet, namespace: data, name: postgres, state: "1/1 Ready, containerPort 5432 name postgres"}
  - {kind: PersistentVolumeClaim, namespace: data, name: data-postgres-0, state: "Bound, 50Gi"}
  - {kind: ConfigMap, namespace: data, name: postgres-conf, state: "listen_addresses=* and port=5432; postgres log shows it is accepting connections"}
  - {kind: Service, namespace: data, name: postgres-headless, state: "headless, selector app=postgres, port 5432; not what checkout dials"}
  - {kind: Deployment, namespace: data, name: postgres-exporter, state: "1/1 Ready, metrics only"}
  - {kind: Service, namespace: data, name: postgres-exporter, state: "ClusterIP port 9187"}
  - {kind: NetworkPolicy, namespace: data, name: postgres-ingress, state: "allows TCP 5432 to app=postgres from namespaces labeled role=app, which shop has; data-plane allow is present"}
  - {kind: Pod, namespace: kube-system, name: coredns-7a8b9c-d1, state: "Running Ready, labels k8s-app=kube-dns"}
  - {kind: Pod, namespace: kube-system, name: coredns-7a8b9c-d2, state: "Running Ready, labels k8s-app=kube-dns"}
  - {kind: Service, namespace: kube-system, name: kube-dns, state: "ClusterIP port 53 UDP and TCP, ready cores"}
  - {kind: Deployment, namespace: edge, name: gateway, state: "2/2 Ready"}
  - {kind: Service, namespace: edge, name: gateway, state: "ClusterIP port 80"}
  - {kind: Ingress, namespace: edge, name: shop, state: "host shop.example.com path /checkout to service checkout in shop via externalName; requests arrive and then the app logs the dial timeout"}
  - {kind: Service, namespace: shop, name: checkout-ext, state: "ExternalName checkout.shop.svc.cluster.local, used by the edge ingress path; not a selector problem"}
  - {kind: ConfigMap, namespace: edge, name: gateway-nginx, state: "proxy_pass to checkout.shop.svc port 8080; gateway access log shows checkout responses of 500 after T0-21m, not a gateway config edit"}
  - {kind: Deployment, namespace: shop, name: recommendations, state: "2/2 Ready"}
  - {kind: Service, namespace: shop, name: recommendations, state: "ClusterIP port 8080"}
  - {kind: CronJob, namespace: data, name: vacuum, state: "schedule 30 3 * * *, last Job Complete at T0-9h"}
  - {kind: Job, namespace: data, name: vacuum-28801, state: "Complete at T0-9h"}
  - {kind: ResourceQuota, namespace: shop, name: compute, state: "requests.cpu used 3200m of 8; not exhausted"}
  - {kind: LimitRange, namespace: shop, name: defaults, state: "Container defaultRequest cpu 50m; checkout sets its own requests"}
sources:
  - "https://kubernetes.io/docs/concepts/services-networking/network-policies/"
---
id: dependency-1
family: dependency
question: "why is cart failing in shop"
expected_outcome: cause
cause_object: StatefulSet/cache/redis
origin_object: StatefulSet/cache/redis
mechanism: "Cart calls Service/cache/redis by the address in its pod env. The Service selector matches the redis pods, but their readiness probe dials TCP 8080 while redis listens on containerPort 6379, so Ready stays False and the Service has no ready pod. Clients receive connection refused. The process is up: the liveness probe still uses 6379, and the log says it is accepting connections there."
passes_if: "names StatefulSet/cache/redis readinessProbe tcpSocket port 8080 against containerPort 6379 named redis, so the pods never go Ready and Service/cache/redis drops cart's connections"
partial_if_only:
  - "cart logs connection refused to redis.cache.svc.cluster.local:6379"
  - "Service/cache/redis has no Ready pods"
chain:
  - from: Deployment/shop/cart
    relation: "label selector"
    to: Pod/shop/cart-8b7c6d5e4-m2kna
    fields: "Deployment.spec.selector.matchLabels app=cart. Pod labels app=cart. Deployment.spec.template.spec.containers[0].env REDIS_ADDR=redis.cache.svc.cluster.local:6379. Two sibling pods carry the same env."
    abnormal: "Since T0-17m the container logs dial tcp: connect: connection refused to redis.cache.svc.cluster.local:6379. OpenTelemetry span redis.GET service.name=cart status ERROR with that refused error. Ready is False because /ready checks redis. Alert CartHighErrorRate namespace=shop service=cart firing since T0-16m. The cart image and env have not changed for 3 days."
  - from: Pod/shop/cart-8b7c6d5e4-m2kna
    relation: "client port and DNS name of a Service, carried by the pod env and the Service port"
    to: Service/cache/redis
    fields: "Pod env REDIS_ADDR host redis and namespace cache match Service.metadata.name and .namespace. The env port 6379 matches Service.spec.ports[0].port 6379, name client. Service.spec.selector app=redis, role=cache."
    abnormal: "Refused connections started at T0-17m. No cart pod uses a different port. The Service object was not edited; the selected pods are not Ready, so the ClusterIP has nowhere to send port 6379."
  - from: Service/cache/redis
    relation: "Service selector"
    to: Pod/cache/redis-0
    fields: "Service.spec.selector app=redis, role=cache matches both Pod/cache/redis-0 and Pod/cache/redis-1. Service targetPort is numeric 6379, equal to the container port number."
    abnormal: "Both pods Running, Ready False, reason ContainersNotReady, message containers with unready status: [redis]. Event T0-2m Warning Unhealthy kubelet Readiness probe failed: dial tcp 10.42.3.20:8080: connect: connection refused. The same event is on redis-1 for 10.42.3.21:8080."
  - from: Pod/cache/redis-0
    relation: "controller ownerReference"
    to: StatefulSet/cache/redis
    fields: "Pod.metadata.ownerReferences[0] is apps/v1 StatefulSet cache/redis, controller true. StatefulSet.spec.template.spec.containers[0].name=redis, ports[0].name=redis, containerPort=6379. readinessProbe.tcpSocket.port=8080, periodSeconds=10. livenessProbe.tcpSocket.port=6379."
    abnormal: "Pods started at T0-18m when the set rolled. restartCount 0. Log: Ready to accept connections tcp 6379. Liveness does not fail. Readiness never succeeds. Helm release redis revision 15 at T0-18m is the edit that set the readiness port to 8080; revision 14 had 6379."
decoys:
  - object: Deployment/shop/cart
    looks_like: "the failing workload itself: not Ready, error spans, a bad release of cart"
    why_not: "cart:4.6.0 and REDIS_ADDR have been on the pods since T0-3d, when redis commands succeeded. The first refused connection is T0-17m, one minute after the redis set rolled. Cart never listens on 6379; it only dials out"
  - object: Job/cache/backup-28100
    looks_like: "a redis-side failure still in the namespace: Job Failed, log connection reset"
    why_not: "that Job finished Failed at T0-6h. Job/cache/backup-28110 succeeded at T0-5h against the same Service. Alert RedisBackupFailed ended at T0-5h. Cart was healthy from T0-5h until T0-17m"
  - object: ConfigMap/cache/redis-conf
    looks_like: "live redis config differs from the chart value requirepass, so clients would be refused"
    why_not: "helm value auth.enabled=true is not in the live ConfigMap, and the redis log says protected-mode no and Ready to accept connections with no AUTH. Cart's error is ECONNREFUSED, not NOAUTH. The Service never gets a Ready backend, which happens before any Redis command"
timeline:
  - "T0-3d: Deployment/shop/cart at image cart:4.6.0 with REDIS_ADDR redis.cache.svc.cluster.local:6379; calls succeeded"
  - "T0-6h: Job/cache/backup-28100 Failed. Alert RedisBackupFailed fired"
  - "T0-5h: Job/cache/backup-28110 Succeeded. Alert RedisBackupFailed ended. Cart still healthy"
