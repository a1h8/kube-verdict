id: quota-1
family: quota
question: "why can't ledger roll out in payments"
expected_outcome: cause
cause_object: Job/payments/statement-export-28910
origin_object: CronJob/payments/statement-export
mechanism: "ResourceQuota/payments/high-mem only counts requests.memory of non-terminal pods whose priorityClassName is high. Job/payments/statement-export-28910 has six Running pods at 512Mi (3Gi) plus the four Running ledger pods at 256Mi (1Gi), so status.used is 4Gi against a hard limit of 4Gi. The ledger surge pod asks for another 256Mi and the ReplicaSet is rejected. The Job counts only because the CronJob template's priorityClassName was changed from batch to high; batch pods in the same namespace are outside this quota."
passes_if: "names Job/payments/statement-export-28910 (its six Running high-priority pods, 512Mi requests.memory each) as what fills scoped ResourceQuota/payments/high-mem, so ReplicaSet/payments/ledger-7c9d8b6f4 cannot create its surge pod"
partial_if_only:
  - "ReplicaSet/payments/ledger-7c9d8b6f4 FailedCreate because ResourceQuota/payments/high-mem is at 4Gi"
  - "Deployment/payments/ledger has ProgressDeadlineExceeded"
chain:
  - from: Deployment/payments/ledger
    relation: "owner of the ReplicaSet created for the rollout"
    to: ReplicaSet/payments/ledger-7c9d8b6f4
    fields: "ReplicaSet.metadata.ownerReferences[0] is apps/v1 Deployment payments/ledger, controller true. Deployment.spec.selector.matchLabels app=ledger, track=stable matches the ReplicaSet. Deployment.spec.strategy.rollingUpdate maxSurge=1, maxUnavailable=0, so the new set is scaled to 1 before the old set drops."
    abnormal: "T0-5m Deployment condition Progressing False, reason ProgressDeadlineExceeded, message ReplicaSet \"ledger-7c9d8b6f4\" has timed out progressing. Available remains True from the old set. Event T0-15m Normal ScalingReplicaSet deployment-controller Scaled up replica set ledger-7c9d8b6f4 to 1."
  - from: ReplicaSet/payments/ledger-7c9d8b6f4
    relation: "ResourceQuota admission on pod create, scoped to PriorityClass high"
    to: ResourceQuota/payments/high-mem
    fields: "ReplicaSet.spec.template.spec.priorityClassName=high and containers[0].resources.requests.memory=256Mi (no change from the running set). ResourceQuota.spec.hard[requests.memory]=4Gi. ResourceQuota.spec.scopeSelector.matchExpressions[0] is scopeName PriorityClass, operator In, values [high]. status.hard and status.used requests.memory are both 4Gi."
    abnormal: "T0-15m through T0, ReplicaSet condition ReplicaFailure True, reason FailedCreate. Event Warning FailedCreate replicaset-controller: Error creating: pods \"ledger-7c9d8b6f4-x9k2m\" is forbidden: exceeded quota: high-mem, requested: requests.memory=256Mi, used: requests.memory=4Gi, limited: requests.memory=4Gi. The pod is never created."
  - from: ResourceQuota/payments/high-mem
    relation: "quota usage sums requests of non-terminal pods in the namespace that match the scopeSelector"
    to: Pod/payments/statement-export-28910-a
    fields: "Pod.status.phase=Running (not Succeeded or Failed, so it is counted). Pod.spec.priorityClassName=high, which is in the quota scopeSelector. Pod.spec.containers[0].resources.requests.memory=512Mi. Five sibling pods statement-export-28910-b through -f are identical. ResourceQuota.status.used requests.memory=4Gi equals those 6x512Mi plus the four Running ledger pods at 256Mi, and does not include batch pods."
    abnormal: "At T0 all six Job pods are Running and Ready, started T0-45m, and still hold 3Gi of the 4Gi used."
  - from: Pod/payments/statement-export-28910-a
    relation: "controller ownerReference"
    to: Job/payments/statement-export-28910
    fields: "Pod.metadata.ownerReferences[0] is batch/v1 Job statement-export-28910, controller true. Job.spec.selector.matchLabels controller-uid matches the pods. Job.spec.template.spec.priorityClassName=high. Job.spec.template.spec.containers[0].resources.requests.memory=512Mi. Job.spec.parallelism=6 and Job.spec.completions=6. Job.status.active=6, status.ready=6, status.succeeded=0."
    abnormal: "Job still active at T0, within its normal runtime, so its pods stay non-terminal and keep the quota full."
decoys:
  - object: Deployment/payments/ledger
    looks_like: "the rollout object nearest the symptom: ProgressDeadlineExceeded and a new ReplicaSet stuck at 0 pods, so the new memory request looks too large"
    why_not: "the new template asks for the same 256Mi and priorityClassName high as the four Ready pods of ReplicaSet/payments/ledger-5a1c2e8d0. That request fit at the T0-2h rollout, when this quota's used memory was only the ledger pods"
  - object: Deployment/payments/analytics
    looks_like: "the memory hog in the namespace: eight Running pods at requests.memory 1Gi each"
    why_not: "those pods have priorityClassName batch. high-mem's scopeSelector counts only PriorityClass high. status.used 4Gi is fully explained by ledger (1Gi) plus the statement-export Job (3Gi); analytics is not in it. ResourceQuota/payments/batch-mem used 8Gi of hard 16Gi, so the batch quota is not what FailedCreate names"
  - object: Node/ip-10-0-2-14
    looks_like: "a node that could not run new pods"
    why_not: "condition MemoryPressure was True from T0-5h and is False at T0, Ready True, lastTransitionTime T0-4h, before the rollout. No ledger pod exists to fail scheduling; admission rejects the create"
timeline:
  - "T0-5h: Node/ip-10-0-2-14 condition MemoryPressure True, Ready False"
  - "T0-4h: Node/ip-10-0-2-14 Ready True, MemoryPressure False, lastTransitionTime T0-4h"
  - "T0-2h: Deployment/payments/ledger rolled to the current image and reached 4/4; ResourceQuota/payments/high-mem used requests.memory was 1Gi"
  - "T0-48m: Helm release statement-export revision 9 set CronJob/payments/statement-export jobTemplate priorityClassName from batch to high. requests.memory stayed 512Mi. The CronJob schedule was not changed"
  - "T0-45m: Job/payments/statement-export-28910 started, six pods Running, priorityClassName high. Quota used requests.memory became 4Gi"
  - "T0-15m: deployment-controller scaled ReplicaSet/payments/ledger-7c9d8b6f4 to 1. replicaset-controller FailedCreate, exceeded quota high-mem, and has retried since"
  - "T0-5m: Deployment/payments/ledger ProgressDeadlineExceeded (progressDeadlineSeconds 600)"
  - "T0: old ledger ReplicaSet 4/4 Ready; new ReplicaSet 0 pods; Job still active 6/6; quota used equals hard"
objects:
  - {kind: Namespace, namespace: "", name: payments, state: "Active, labels team=payments and pod-security=baseline"}
  - {kind: Namespace, namespace: "", name: treasury, state: "Active, labels team=treasury"}
  - {kind: Namespace, namespace: "", name: checkout, state: "Active, labels team=shop"}
  - {kind: Node, namespace: "", name: ip-10-0-2-14, state: "Ready, MemoryPressure False since T0-4h, no taints"}
  - {kind: Node, namespace: "", name: ip-10-0-2-22, state: "Ready, no pressure conditions"}
  - {kind: Node, namespace: "", name: ip-10-0-2-31, state: "Ready, no pressure conditions"}
  - {kind: ResourceQuota, namespace: payments, name: batch-mem, state: "hard requests.memory 16Gi, used 8Gi, scopeSelector PriorityClass batch; not named by the FailedCreate"}
  - {kind: ResourceQuota, namespace: treasury, name: compute, state: "hard requests.cpu 8, used 2100m; hard pods 40, used 11"}
  - {kind: LimitRange, namespace: payments, name: defaults, state: "Container default cpu 200m/500m; ledger and the Job set their own requests, so defaults do not apply"}
  - {kind: ReplicaSet, namespace: payments, name: ledger-5a1c2e8d0, state: "4/4 Ready, requests.memory 256Mi, priorityClassName high, image ledger:1.9.3, same as the new set"}
  - {kind: Deployment, namespace: payments, name: analytics, state: "8/8 Ready, priorityClassName batch, requests.memory 1Gi, image analytics:4.1.0"}
  - {kind: ReplicaSet, namespace: payments, name: analytics-6aa91c, state: "8/8 Ready, owned by analytics"}
  - {kind: Service, namespace: payments, name: ledger, state: "ClusterIP port 8080, selector app=ledger,track=stable, four ready pods"}
  - {kind: Service, namespace: payments, name: analytics, state: "ClusterIP port 8080, eight ready pods"}
  - {kind: ConfigMap, namespace: payments, name: ledger-env, state: "keys LOG_LEVEL=info and LEDGER_MODE=post; mounted by the running ledger pods"}
  - {kind: ConfigMap, namespace: payments, name: statement-export, state: "key WINDOW=1d, unchanged since T0-6d; the Job reads it and is running, not crashlooping"}
  - {kind: ServiceAccount, namespace: payments, name: ledger, state: "no imagePullSecrets; ledger pods pull the public registry image"}
  - {kind: ServiceAccount, namespace: payments, name: statement-export, state: "used by the Job; pods are Running"}
  - {kind: HorizontalPodAutoscaler, namespace: payments, name: analytics, state: "min 4 max 8, current 8, ScalingActive True, ScalingLimited True at max, cpu 71% of a 75% target; analytics is not the quota scope"}
  - {kind: PodDisruptionBudget, namespace: payments, name: ledger, state: "selector app=ledger, minAvailable 2, currently 4 healthy, disruptionsAllowed 2"}
  - {kind: CronJob, namespace: payments, name: fee-sweep, state: "schedule 15 2 * * *, last Job succeeded at T0-6h, priorityClassName batch"}
  - {kind: Job, namespace: payments, name: fee-sweep-28890, state: "Complete, succeeded 1 at T0-6h; its pod is Succeeded and does not count in the quota"}
  - {kind: Deployment, namespace: treasury, name: api, state: "3/3 Ready, image treasury-api:2.4.1"}
  - {kind: Service, namespace: treasury, name: api, state: "ClusterIP port 8080, three ready pods"}
  - {kind: Deployment, namespace: treasury, name: worker, state: "2/2 Ready"}
  - {kind: StatefulSet, namespace: treasury, name: postgres, state: "1/1 Ready, PVC Bound"}
  - {kind: Service, namespace: treasury, name: postgres, state: "ClusterIP port 5432, selector app=postgres"}
