id: limitrange-1
family: limitrange
question: "why can't report-worker roll out in analytics"
expected_outcome: cause
cause_object: LimitRange/analytics/defaults
origin_object: LimitRange/analytics/defaults
mechanism: "LimitRanger defaults a container memory limit of 64Mi onto report-worker pods because the Deployment sets neither requests nor limits. Pods admitted after the default changed from 1Gi to 64Mi start and are OOMKilled. Pods still running from before the change have the old 1Gi limit and the same image, and they stay Ready, so the rollout never finishes."
passes_if: "names LimitRange/analytics/defaults container default memory 64Mi, applied to Deployment/analytics/report-worker because its template sets no memory, and the resulting limit OOMKills the new pods"
partial_if_only:
  - "new report-worker pods are OOMKilled with limits.memory 64Mi"
  - "Deployment/analytics/report-worker sets no memory request or limit"
chain:
  - from: Deployment/analytics/report-worker
    relation: "label selector"
    to: Pod/analytics/report-worker-6d4f8c9b7-a1b2c
    fields: "Deployment.spec.selector.matchLabels app=report-worker. Pod labels match. Deployment.spec.template.spec.containers[0].name=report-worker has no resources.requests and no resources.limits. Image on the template and on this pod is worker:3.2.0."
    abnormal: "Pod created T0-12m, phase Running, container lastState.terminated.reason OOMKilled, exitCode 137, at T0-11m, T0-8m and T0-3m. Current state Waiting, reason CrashLoopBackOff. Event T0-3m Warning BackOff kubelet Back-off restarting failed container report-worker in pod report-worker-6d4f8c9b7-a1b2c_analytics. The live pod spec has resources.requests.memory=64Mi and resources.limits.memory=64Mi, which the template does not set."
  - from: Pod/analytics/report-worker-6d4f8c9b7-a1b2c
    relation: "LimitRanger admission default for a container that omits memory"
    to: LimitRange/analytics/defaults
    fields: "LimitRange.spec.limits[0].type=Container, default.memory=64Mi, defaultRequest.memory=64Mi, default.cpu=100m, defaultRequest.cpu=50m. There is no max and no min. The pod's limits.memory and requests.memory equal that default. The pod has no memory field of its own in the owning Deployment template, which is what LimitRanger fills in at admission."
    abnormal: "The 64Mi limit is the cgroup the OOMKilled status is charged to. Pod/analytics/report-worker-5b1e0a2c3-old1 and old2 were created at T0-2d, same image worker:3.2.0, live limits.memory=1Gi, Ready True, restartCount 0. They were admitted under the previous default and were not mutated when the LimitRange changed."
decoys:
  - object: Pod/analytics/report-worker-6d4f8c9b7-a1b2c
    looks_like: "the new pod is the fault: OOMKilled, so worker:3.2.0 leaks or the rollout image is too heavy"
    why_not: "worker:3.2.0 is also the image on report-worker-5b1e0a2c3-old1 and old2, Ready for two days with limits.memory 1Gi. The new pod differs in the admitted limit, 64Mi, not in the image or args"
  - object: Pod/analytics/api-0
    looks_like: "memory pressure already took down a pod in this namespace"
    why_not: "api-0 lastState.terminated.reason OOMKilled finishedAt T0-7h, then the container started again with its explicit limits.memory 1Gi and has been Ready since T0-7h, restartCount 1. report-worker pods from that time are the old Ready replicas. The worker OOMKills start at T0-11m"
  - object: ConfigMap/analytics/report-worker
    looks_like: "data.GOMEMLIMIT=64MiB would make the process stay under 64Mi and then die"
    why_not: "the key is not referenced. The pod spec has no env or envFrom and no volume pointing at this ConfigMap. The process log says GOMEMLIMIT is unset, using the cgroup limit. Helm values also omit GOMEMLIMIT; the key is leftover data the workload does not mount"
timeline:
  - "T0-2d: Pod/analytics/report-worker-5b1e0a2c3-old1 and old2 admitted with defaulted limits.memory 1Gi, image worker:3.2.0, and they are still Ready at T0"
  - "T0-7h: Pod/analytics/api-0 OOMKilled once and returned to Ready with an explicit 1Gi limit"
  - "T0-20m: Helm release analytics-limits revision 7 set LimitRange/analytics/defaults Container default.memory and defaultRequest.memory from 1Gi to 64Mi"
  - "T0-12m: Deployment/analytics/report-worker restarted (annotation kubectl.kubernetes.io/restartedAt). Template still has no resources and the same image. ReplicaSet report-worker-6d4f8c9b7 created pods, maxUnavailable 0, so the old pods stayed"
  - "T0-11m: new pod containers OOMKilled, exit 137, and kubelet BackOff continues through T0"
  - "T0-2m: Deployment condition Progressing False, ProgressDeadlineExceeded, message ReplicaSet \"report-worker-6d4f8c9b7\" has timed out progressing. availableReplicas 2 from the old set, updatedReplicas 0"
  - "T0: LimitRange default memory is 64Mi; new pods CrashLoopBackOff at 64Mi; old pods Ready at 1Gi"
objects:
  - {kind: Namespace, namespace: "", name: analytics, state: "Active, labels team=analytics"}
  - {kind: Namespace, namespace: "", name: reporting, state: "Active, labels team=reporting"}
