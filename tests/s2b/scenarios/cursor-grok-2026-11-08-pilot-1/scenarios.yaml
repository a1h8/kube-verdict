id: webhook-1
family: webhook
question: "why do new pods for the payments Deployment fail to create"
expected_outcome: cause
cause_object: MutatingWebhookConfiguration/istio-sidecar-injector
origin_object: Deployment/istio-system/istiod
mechanism: "The MutatingWebhookConfiguration for the sidecar injector points at a Service whose pods are not ready because istiod was scaled to 0; the webhook call times out and the apiserver rejects the pod create for the payments Deployment."
passes_if: "names MutatingWebhookConfiguration/istio-sidecar-injector (or the unreachable webhook Service) as causing the pod creation failures"
partial_if_only: ["names FailedCreate on the payments ReplicaSet", "names that the webhook is configured"]
chain:
  - from: Deployment/payments/payment-api
    relation: "owns via ownerReference"
    to: ReplicaSet/payments/payment-api-3d4e5
    fields: "Deployment and ReplicaSet ownerReferences; ReplicaSet events"
    abnormal: "ReplicaSet event FailedCreate at T0-2m: 'Error creating: Internal error occurred: failed calling webhook \"namespace.sidecar-injector.istio.io\": failed to call webhook: Post \"https://istiod.istio-system.svc:443/inject\": context deadline exceeded'"
  - from: ReplicaSet/payments/payment-api-3d4e5
    relation: "subject to mutating admission webhook"
    to: MutatingWebhookConfiguration/istio-sidecar-injector
    fields: "MutatingWebhookConfiguration.webhooks[].clientConfig.service.name=istiod, namespace=istio-system; rules match pods in payments"
    abnormal: "Webhook configuration active; the target Service has 0 ready pods because Deployment/istio-system/istiod replicas=0"
decoys:
  - object: Deployment/payments/payment-api
    looks_like: "the Deployment the operator is trying to roll out"
    why_not: "the Deployment and its container image are valid; the failure is injected by the admission webhook before the pod is persisted"
  - object: ValidatingWebhookConfiguration/pod-security
    looks_like: "another webhook that might reject"
    why_not: "the tool cannot read ValidatingWebhookConfigurations; the error message explicitly names the istio sidecar-injector webhook"
  - object: NetworkPolicy/istio-system/allow-webhook
    looks_like: "a NetworkPolicy blocking the webhook call"
    why_not: "the istiod pods themselves are not running; there is no network path issue, just no endpoints"
timeline:
  - "T0-3h: Deployment/istio-system/istiod scaled to 0 during maintenance"
  - "T0-30m: payments/payment-api image updated, triggering new ReplicaSet"
  - "T0-2m: ReplicaSet emits FailedCreate with webhook timeout to istiod.istio-system.svc"
  - "T0: operator asks why new payment-api pods cannot be created"
