id: configmap-1
family: configmap
question: "why is the cart service in shop returning 500s after the last deploy"
expected_outcome: cause
cause_object: ConfigMap/shop/cart-config
origin_object: ConfigMap/shop/cart-config
mechanism: "The cart Deployment mounts ConfigMap/shop/cart-config as a volume; an update to the ConfigMap introduced an invalid YAML key that the cart application cannot parse, causing it to start but immediately return 500 on every request."
passes_if: "names ConfigMap/shop/cart-config as containing the invalid configuration that breaks the cart pods"
partial_if_only: ["names cart pods are Ready but returning errors", "names the cart Deployment was rolled"]
chain:
  - from: Deployment/shop/cart
    relation: "mounts the ConfigMap as a volume"
    to: ConfigMap/shop/cart-config
    fields: "Deployment.spec.template.spec.volumes.configMap.name=cart-config; Pod.spec.volumes and volumeMounts; ConfigMap.data"
    abnormal: "ConfigMap data contains invalid key 'features::enabled' (double colon) at T0-15m; cart container logs show 'yaml: unmarshal errors'"
  - from: ConfigMap/shop/cart-config
    relation: "consumed by the application inside the pods selected by the Deployment"
    to: Pod/shop/cart-8j9k0-xyz
    fields: "Pod mounts the ConfigMap; container logs reference the parse failure"
    abnormal: "Pod is Running/Ready but logs at T0-12m: 'failed to load config: yaml: line 12: did not find expected key'; application returns HTTP 500"
decoys:
  - object: Deployment/shop/cart
    looks_like: "the Deployment that was just rolled out"
    why_not: "the new image is healthy; the breakage is solely from the ConfigMap content that was updated in the same change window"
  - object: Service/shop/cart
    looks_like: "the Service might have lost endpoints"
    why_not: "endpoints are present and pods are Ready; the 500s are application-level from bad config"
  - object: ConfigMap/shop/frontend-config
    looks_like: "another ConfigMap changed around the same time"
    why_not: "frontend-config change was a harmless annotation; cart-config is the one mounted by the failing pods"
timeline:
  - "T0-20m: ConfigMap/shop/cart-config updated with invalid YAML"
  - "T0-18m: cart Deployment rolled to pick up the new ConfigMap (via checksum annotation)"
  - "T0-15m: new cart pods start, log yaml unmarshal error"
  - "T0-12m: cart begins returning 500 on all requests"
  - "T0: operator asks why cart is returning 500s"
