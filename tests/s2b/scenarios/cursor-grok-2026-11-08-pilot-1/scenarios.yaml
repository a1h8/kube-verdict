id: quota-1
family: quota
question: "why can't the checkout deployment scale up in shop"
expected_outcome: cause
cause_object: ResourceQuota/payments/rq-compute
origin_object: Deployment/payments/invoice-worker
mechanism: "The ResourceQuota in payments is exhausted by invoice-worker pods that request cpu/memory; the shop namespace has no local quota, but the checkout Deployment's new ReplicaSet cannot create pods because the cluster-scoped admission check against the payments quota (via a shared node pool and cross-namespace accounting in this setup) rejects them after the invoice-worker scale-up."
passes_if: "names ResourceQuota/payments/rq-compute as the object whose hard limits block the new checkout pods"
partial_if_only: ["names the checkout ReplicaSet FailedCreate events", "names the invoice-worker Deployment high replica count"]
chain:
  - from: Deployment/shop/checkout
    relation: "owns via ownerReference"
    to: ReplicaSet/shop/checkout-7f9d8c
    fields: "Deployment.status.conditions and ReplicaSet.metadata.ownerReferences; ReplicaSet.spec.replicas > status.readyReplicas"
    abnormal: "ReplicaSet event FailedCreate at T0-2m: 'Error creating: pods \"checkout-7f9d8c-xyz\" is forbidden: exceeded quota: rq-compute, requested: requests.cpu=500m, used: requests.cpu=8, limited: requests.cpu=8'"
  - from: ReplicaSet/shop/checkout-7f9d8c
    relation: "subject to ResourceQuota via admission (namespace selector and hard limits on requests)"
    to: ResourceQuota/payments/rq-compute
    fields: "ResourceQuota.spec.hard.requests.cpu=8, status.used.requests.cpu=8; the FailedCreate message references the quota name"
    abnormal: "ResourceQuota status.used.requests.cpu == hard at T0; event on the ReplicaSet cites exceeded quota rq-compute"
decoys:
  - object: ResourceQuota/shop/rq-shop
    looks_like: "shop has its own ResourceQuota with low remaining pods"
    why_not: "rq-shop still has headroom (used.pods=3 of hard=20); the FailedCreate message names rq-compute not rq-shop"
  - object: Deployment/shop/checkout
    looks_like: "the Deployment itself is the nearest object and shows unavailable replicas"
    why_not: "the Deployment is healthy; the failure is only on new pod creation by its ReplicaSet, caused by the remote quota"
  - object: Pod/payments/invoice-worker-0
    looks_like: "a previously failing pod in payments that was CrashLooping"
    why_not: "that CrashLoop was resolved at T0-4h; current pods are Running and Ready; the quota exhaustion is from the successful scale-up of invoice-worker"
timeline:
  - "T0-6h: ResourceQuota/payments/rq-compute created with hard requests.cpu=8, requests.memory=16Gi"
  - "T0-4h: invoice-worker CrashLoop resolved after image fix; pods now Running"
  - "T0-45m: Deployment/payments/invoice-worker scaled from 4 to 16 replicas (each requesting 500m cpu), filling the quota"
  - "T0-30m: shop/checkout Deployment scaled from 3 to 6 replicas"
  - "T0-2m: ReplicaSet/shop/checkout-7f9d8c emits FailedCreate events citing exceeded quota rq-compute"
  - "T0: operator asks why checkout cannot scale"
objects:
  - Namespace/shop: Active
  - Namespace/payments: Active
  - Namespace/observability: Active
  - Deployment/shop/frontend: 3/3 Ready
  - Deployment/shop/cart: 2/2 Ready
  - Deployment/shop/search: 4/4 Ready
  - Deployment/payments/payment-api: 5/5 Ready
  - Deployment/payments/invoice-worker: 16/16 Ready (requests 500m each)
  - Deployment/observability/prometheus: 1/1 Ready
  - ReplicaSet/shop/checkout-7f9d8c: desired 6, ready 3, FailedCreate events
  - ReplicaSet/shop/frontend-abc: 3/3
  - ReplicaSet/payments/invoice-worker-xyz: 16/16
  - Service/shop/checkout: ClusterIP, endpoints ready
  - Service/shop/frontend: ClusterIP
  - Service/payments/payment-api: ClusterIP
  - ConfigMap/shop/checkout-config: data present
  - ConfigMap/payments/worker-config: data present
  - ResourceQuota/shop/rq-shop: hard pods=20, used=9
  - ResourceQuota/payments/rq-compute: hard requests.cpu=8, used=8
  - LimitRange/shop/lr-default: default requests present
  - Pod/shop/checkout-7f9d8c-aaa: Running
  - Pod/shop/checkout-7f9d8c-bbb: Running
  - Pod/shop/checkout-7f9d8c-ccc: Running
  - Pod/payments/invoice-worker-0: Running
  - Pod/payments/invoice-worker-1: Running
  - HorizontalPodAutoscaler/shop/checkout-hpa: current 3, desired 3
  - NetworkPolicy/shop/allow-frontend: allows ingress
  - ServiceAccount/shop/default: present
  - ServiceAccount/payments/default: present
  - PersistentVolumeClaim/shop/checkout-cache: Bound
  - Ingress/shop/shop-ingress: routes to frontend
sources:
  - "https://kubernetes.io/docs/concepts/policy/resource-quotas/"
  - "https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/#pod-failure-policy"
