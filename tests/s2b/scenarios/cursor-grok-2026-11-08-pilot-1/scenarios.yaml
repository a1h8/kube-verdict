id: hpa-1
family: hpa
question: "why is the api Deployment in shop not scaling up under load"
expected_outcome: cause
cause_object: HorizontalPodAutoscaler/shop/api-hpa
origin_object: ConfigMap/shop/api-config
mechanism: "The HPA targets the api Deployment but its metric is a custom pods metric that was broken when the api ConfigMap removed the sidecar that exported the metric; the HPA therefore sees no metric values and stays at the minimum replica count while CPU load is high."
passes_if: "names HorizontalPodAutoscaler/shop/api-hpa as unable to scale because its metric is missing or stale"
partial_if_only: ["names high CPU on api pods", "names the api Deployment replica count is low"]
chain:
  - from: Deployment/shop/api
    relation: "scale target of the HPA"
    to: HorizontalPodAutoscaler/shop/api-hpa
    fields: "HPA.spec.scaleTargetRef.kind=Deployment, name=api; Deployment.status.replicas=2 (minReplicas)"
    abnormal: "HPA status.conditions AbleToScale=False, reason FailedGetPodsMetric at T0-5m; currentReplicas=2 while load is high"
  - from: HorizontalPodAutoscaler/shop/api-hpa
    relation: "depends on metric produced by pods selected by the target"
    to: ConfigMap/shop/api-config
    fields: "HPA.spec.metrics.pods.metric.name=http_requests_per_second; ConfigMap data that previously enabled the metrics sidecar, now removed"
    abnormal: "HPA event FailedGetPodsMetric: 'unable to get metric http_requests_per_second: no metrics returned'; ConfigMap change at T0-40m removed the exporter"
decoys:
  - object: ResourceQuota/shop/rq-shop
    looks_like: "quota prevents more pods"
    why_not: "quota has headroom (used.pods well below hard); the HPA itself is not generating a scale-up decision"
  - object: Deployment/shop/api
    looks_like: "the Deployment is stuck at 2 replicas"
    why_not: "the Deployment would accept a higher replica count; the HPA is not requesting it because of the missing metric"
  - object: HorizontalPodAutoscaler/shop/frontend-hpa
    looks_like: "another HPA that is scaling correctly"
    why_not: "frontend-hpa uses CPU metric and is healthy; it is unrelated to the api symptom"
timeline:
  - "T0-40m: ConfigMap/shop/api-config updated, removing metrics-sidecar enablement"
  - "T0-35m: api pods rolled, no longer exporting http_requests_per_second"
  - "T0-20m: load increases, CPU on api pods > 80%"
  - "T0-5m: HPA status shows FailedGetPodsMetric, remains at minReplicas=2"
  - "T0: operator asks why api is not scaling"
objects:
  - Namespace/shop: Active
  - Namespace/payments: Active
  - Namespace/observability: Active
  - Deployment/shop/api: 2/2 Ready, high CPU
  - Deployment/shop/frontend: 4/4 Ready
  - Deployment/shop/cart: 2/2 Ready
  - Deployment/payments/payment-api: 3/3 Ready
  - HorizontalPodAutoscaler/shop/api-hpa: minReplicas=2, current=2, FailedGetPodsMetric
  - HorizontalPodAutoscaler/shop/frontend-hpa: scaling normally on CPU
  - ConfigMap/shop/api-config: metrics sidecar disabled
  - ConfigMap/shop/frontend-config: present
  - Service/shop/api: ClusterIP
  - Service/shop/frontend: ClusterIP
  - Pod/shop/api-7k8l9-xyz: Running, CPU 85%
  - Pod/shop/api-7k8l9-abc: Running, CPU 90%
  - ResourceQuota/shop/rq-shop: used.pods=12 of 30
  - LimitRange/shop/lr: present
  - NetworkPolicy/shop/allow-api: present
  - ServiceAccount/shop/api: present
