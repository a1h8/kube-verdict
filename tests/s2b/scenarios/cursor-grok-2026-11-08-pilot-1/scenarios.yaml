expected_outcome: no_incident
mechanism: "All worker pods are Running and were pulled successfully; a previous ImagePullBackOff on an old ReplicaSet ended hours ago after the correct imagePullSecret was added to the ServiceAccount, a warning event in another namespace is unrelated, and a missing secret reference in a different Deployment does not affect batch."
passes_if: "states that there is no incident and names no fault"
partial_if_only: []
chain: []
decoys:
  - object: ReplicaSet/batch/worker-old
    looks_like: "old ReplicaSet still shows ImagePullBackOff events"
    why_not: "those events are from T0-5h; the current ReplicaSet and pods are Running with successful pulls"
  - object: ServiceAccount/shop/default
    looks_like: "a ServiceAccount without imagePullSecrets"
    why_not: "it is in shop; the batch worker ServiceAccount has the correct secret reference and pulls succeed"
  - object: Pod/batch/worker-9h8j7-xyz
    looks_like: "pod has an event about secret"
    why_not: "the event is a normal 'Pulling' / 'Pulled' sequence that completed successfully; pod is Running"
timeline:
