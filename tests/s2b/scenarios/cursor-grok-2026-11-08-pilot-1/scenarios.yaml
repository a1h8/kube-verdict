id: dependency-1
family: dependency
question: "why are checkout pods in shop crash-looping"
expected_outcome: cause
cause_object: Deployment/payments/redis
origin_object: ConfigMap/payments/redis-config
mechanism: "Checkout pods connect to the redis Service in payments; the redis Deployment was scaled to 0 after a ConfigMap change that set an invalid maxmemory, causing redis pods to fail readiness; checkout therefore cannot open connections and crashes."
passes_if: "names Deployment/payments/redis (or its pods) as the unreachable dependency that causes checkout to crash"
partial_if_only: ["names checkout CrashLoopBackOff", "names the redis Service"]
chain:
  - from: Pod/shop/checkout-5f6g7-xyz
    relation: "env and connection string reference the dependency Service"
    to: Service/payments/redis
    fields: "Pod.spec.containers.env valueFrom or value containing redis.payments.svc; Service.metadata.name=redis, namespace=payments"
    abnormal: "checkout container logs at T0-4m: 'dial tcp: lookup redis.payments.svc.cluster.local: no such host' / connection refused; Pod status CrashLoopBackOff"
  - from: Service/payments/redis
    relation: "selects pods of the redis Deployment"
    to: Deployment/payments/redis
    fields: "Service.spec.selector.app=redis; Deployment.metadata.labels.app=redis, status.replicas=0, status.readyReplicas=0"
    abnormal: "Deployment status replicas=0 at T0; no endpoints; redis pods terminated after ConfigMap-driven crash"
decoys:
  - object: ConfigMap/shop/checkout-config
    looks_like: "checkout ConfigMap was updated recently"
    why_not: "the update only changed a feature flag; connection string to redis is unchanged and still correct"
  - object: Pod/shop/checkout-5f6g7-xyz
    looks_like: "the crash-looping pod itself is the problem"
    why_not: "the pod is a symptom; its logs show it cannot reach the redis dependency"
  - object: NetworkPolicy/payments/allow-redis
    looks_like: "a NetworkPolicy that might block traffic"
    why_not: "the policy allows ingress from shop; the redis pods are simply not running"
timeline:
  - "T0-2h: ConfigMap/payments/redis-config updated with invalid maxmemory value"
  - "T0-90m: redis pods enter CrashLoopBackOff due to bad config"
  - "T0-60m: Deployment/payments/redis scaled to 0 by operator while debugging"
  - "T0-10m: checkout pods begin CrashLoopBackOff after redis became unavailable"
  - "T0-4m: checkout logs show connection failures to redis.payments.svc"
  - "T0: operator asks why checkout is crash-looping"
objects:
  - Namespace/shop: Active
  - Namespace/payments: Active
  - Namespace/observability: Active
  - Deployment/shop/checkout: desired 3, ready 0, CrashLoopBackOff
  - Deployment/shop/frontend: 3/3 Ready
  - Deployment/shop/cart: 2/2 Ready
  - Deployment/payments/redis: desired 0, ready 0
  - Deployment/payments/payment-api: 4/4 Ready
  - Deployment/observability/loki: 1/1 Ready
  - Service/payments/redis: ClusterIP, 0 endpoints
  - Service/shop/checkout: ClusterIP
  - Service/payments/payment-api: ClusterIP
  - ConfigMap/payments/redis-config: contains maxmemory=invalid
  - ConfigMap/shop/checkout-config: present
  - Pod/shop/checkout-5f6g7-xyz: CrashLoopBackOff, logs connection refused
  - Pod/shop/checkout-5f6g7-abc: CrashLoopBackOff
  - Pod/payments/payment-api-0: Running
  - NetworkPolicy/payments/allow-redis: allows from shop
  - NetworkPolicy/shop/default: present
  - ServiceAccount/shop/checkout: present
  - ServiceAccount/payments/redis: present
  - HorizontalPodAutoscaler/shop/checkout-hpa: current 0
  - PersistentVolumeClaim/payments/redis-data: Bound but unused
  - Ingress/shop/shop-ingress: present
