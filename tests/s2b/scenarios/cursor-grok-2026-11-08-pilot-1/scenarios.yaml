id: netpol-1
family: netpol
question: "why is the search service in shop returning connection refused from the frontend pods"
expected_outcome: cause
cause_object: NetworkPolicy/observability/deny-cross-ns
origin_object: NetworkPolicy/observability/deny-cross-ns
mechanism: "A NetworkPolicy in the observability namespace selects all pods via an empty podSelector and uses a namespaceSelector that matches the shop namespace on the label monitoring=enabled; its egress rule is empty, so shop pods that were labelled for scraping can no longer initiate connections to the search Service."
passes_if: "names NetworkPolicy/observability/deny-cross-ns as blocking egress from shop pods to search"
partial_if_only: ["names that frontend cannot reach search", "names the search Service has no endpoints"]
chain:
  - from: Pod/shop/frontend-7d8f9-xyz
    relation: "selected by NetworkPolicy podSelector + namespaceSelector"
    to: NetworkPolicy/observability/deny-cross-ns
    fields: "NetworkPolicy.spec.podSelector={} (selects all), namespaceSelector.matchLabels.monitoring=enabled; Pod.metadata.labels and Namespace/shop.metadata.labels.monitoring=enabled"
    abnormal: "Pod logs at T0-8m show 'dial tcp 10.96.12.45:8080: connect: connection refused'; NetworkPolicy status shows it is active"
  - from: NetworkPolicy/observability/deny-cross-ns
    relation: "controls egress for selected pods; empty egress denies all"
    to: Service/shop/search
    fields: "NetworkPolicy.spec.policyTypes=[Egress], egress=[]; Service.spec.selector matches search pods that frontend tries to reach"
    abnormal: "No allowed egress ports or peers; frontend connection attempts fail while search pods themselves are Ready"
decoys:
  - object: NetworkPolicy/shop/allow-search
    looks_like: "the local NetworkPolicy in shop that should allow traffic"
    why_not: "allow-search only governs ingress into search pods; the deny is an egress policy applied to the frontend pods via the cross-namespace selector"
  - object: Service/shop/search
    looks_like: "search Service has 0 endpoints"
    why_not: "endpoints are present (search pods Ready); the refusal is from the client side NetworkPolicy drop, not missing endpoints"
  - object: Pod/shop/search-0
    looks_like: "a search pod that restarted 2h ago"
    why_not: "restart was a normal rolling update; pod is Ready and listening; the failure started only after the observability NetworkPolicy was applied"
timeline:
  - "T0-3h: Namespace/shop labelled monitoring=enabled for Prometheus scraping"
  - "T0-90m: NetworkPolicy/observability/deny-cross-ns created with empty egress to isolate observability tooling"
  - "T0-10m: frontend pods begin failing connections to search (connection refused in logs)"
  - "T0-8m: increased error rate visible in frontend container logs"
  - "T0: operator asks why search is unreachable from frontend"
