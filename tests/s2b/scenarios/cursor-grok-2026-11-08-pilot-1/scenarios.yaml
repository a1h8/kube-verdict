expected_outcome: no_incident
mechanism: "The Ingress is correctly configured and routes to the frontend Service whose pods are all Ready; a previous backend timeout alert resolved an hour ago, an annotation drift on the Ingress has no effect on routing, and a NetworkPolicy warning in another namespace does not affect this path."
passes_if: "states that there is no incident and names no fault"
partial_if_only: []
chain: []
decoys:
  - object: Ingress/shop/shop-ingress
    looks_like: "annotation nginx.ingress.kubernetes.io/proxy-body-size was changed"
    why_not: "the annotation only affects body size limits; current traffic is small and routing works"
  - object: Alertmanager alert IngressBackendTimeout
    looks_like: "alert fired earlier"
    why_not: "the alert resolved at T0-60m after a transient blip; no active alert and pods are Ready"
  - object: NetworkPolicy/payments/default-deny
    looks_like: "a deny policy exists"
    why_not: "it is in payments and does not select shop frontend pods or the Ingress controller"
timeline:
