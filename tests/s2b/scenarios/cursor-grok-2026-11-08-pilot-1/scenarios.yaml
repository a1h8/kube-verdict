id: limitrange-1
family: limitrange
question: "why do new pods of the worker Deployment in batch fail to schedule"
expected_outcome: cause
cause_object: LimitRange/batch/lr-mem
origin_object: LimitRange/batch/lr-mem
mechanism: "The LimitRange in batch sets a default memory limit of 256Mi and a max of 512Mi; the worker Deployment specifies a memory request of 1Gi with no limit, so the LimitRanger admission plugin rejects the pods because the implied limit would violate maxLimitRequestRatio and the max limit."
passes_if: "names LimitRange/batch/lr-mem as rejecting the worker pods via default or max memory constraints"
partial_if_only: ["names the worker ReplicaSet FailedCreate", "names that pods have high memory requests"]
chain:
  - from: Deployment/batch/worker
    relation: "owns via ownerReference"
    to: ReplicaSet/batch/worker-9h8j7
    fields: "Deployment.status and ReplicaSet.metadata.ownerReferences; ReplicaSet events"
    abnormal: "ReplicaSet event FailedCreate at T0-3m: 'Error creating: pods \"worker-9h8j7-xyz\" is forbidden: [maximum memory usage per Container is 512Mi, but limit is 1Gi]'"
  - from: ReplicaSet/batch/worker-9h8j7
    relation: "subject to LimitRange defaults and max via LimitRanger admission"
    to: LimitRange/batch/lr-mem
    fields: "LimitRange.spec.limits.default.memory=256Mi, max.memory=512Mi, maxLimitRequestRatio.memory=2; Pod.spec.containers.resources.requests.memory=1Gi (no limits)"
    abnormal: "LimitRange is active; admission rejects because request 1Gi would force a limit exceeding max"
decoys:
  - object: ResourceQuota/batch/rq-batch
    looks_like: "the ResourceQuota is nearly full"
    why_not: "rq-batch still has memory headroom; the error message cites the LimitRange max, not quota exceeded"
  - object: Deployment/batch/worker
    looks_like: "the Deployment is the object the operator is looking at"
    why_not: "the Deployment is correctly configured for its intent; the LimitRange silently injects/enforces constraints that make the pods invalid"
  - object: LimitRange/shop/lr-default
    looks_like: "another LimitRange in a different namespace"
    why_not: "shop LimitRange does not apply to batch pods; the rejection is namespace-local to batch"
timeline:
  - "T0-5h: LimitRange/batch/lr-mem created with max memory 512Mi and default 256Mi"
  - "T0-2h: Deployment/batch/worker updated to request 1Gi memory (previously 200Mi)"
  - "T0-30m: worker Deployment scaled up, triggering new pod creation"
  - "T0-3m: ReplicaSet emits FailedCreate citing maximum memory usage"
  - "T0: operator asks why new worker pods fail"
objects:
  - Namespace/batch: Active
  - Namespace/shop: Active
  - Namespace/payments: Active
  - Deployment/batch/worker: desired 5, ready 2
  - Deployment/batch/scheduler: 1/1 Ready
  - Deployment/shop/frontend: 3/3 Ready
  - Deployment/payments/payment-api: 3/3 Ready
  - ReplicaSet/batch/worker-9h8j7: desired 5, ready 2, FailedCreate events
  - ReplicaSet/batch/scheduler-abc: 1/1
  - LimitRange/batch/lr-mem: max memory 512Mi, default 256Mi
  - LimitRange/shop/lr-default: defaults present
  - ResourceQuota/batch/rq-batch: hard memory 32Gi, used 8Gi
  - ResourceQuota/shop/rq-shop: present
  - Pod/batch/worker-9h8j7-aaa: Running (old revision)
  - Pod/batch/worker-9h8j7-bbb: Running
  - Service/batch/worker: ClusterIP
  - ConfigMap/batch/worker-config: present
  - ServiceAccount/batch/worker: present
  - HorizontalPodAutoscaler/batch/worker-hpa: current 2
  - NetworkPolicy/batch/allow-internal: present
  - Job/batch/cleanup: Completed
  - CronJob/batch/nightly: present
  - PersistentVolumeClaim/batch/worker-data: Bound
  - Ingress/shop/shop-ingress: present
