  - NetworkPolicy/observability/deny-cross-ns: podSelector={}, namespaceSelector monitoring=enabled, egress empty
  - NetworkPolicy/payments/default-deny: present
  - Pod/shop/frontend-7d8f9-xyz: Running, logs show connection refused
  - Pod/shop/frontend-7d8f9-abc: Running
  - Pod/shop/search-0: Running Ready
  - Pod/shop/search-1: Running Ready
  - ConfigMap/shop/search-config: present
  - ConfigMap/observability/prometheus-config: present
  - ServiceAccount/shop/default: present
  - ServiceAccount/observability/prometheus: present
