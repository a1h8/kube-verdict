id: pdb-1
family: pdb
question: "why is the drain of node worker-3 stuck while evicting shop pods"
expected_outcome: cause
cause_object: PodDisruptionBudget/shop/search-pdb
origin_object: PodDisruptionBudget/shop/search-pdb
mechanism: "The PodDisruptionBudget for search requires minAvailable=2; with only 2 search pods both on the node being drained, the eviction of either would violate the PDB, so the drain cannot proceed for those pods and blocks the node drain."
passes_if: "names PodDisruptionBudget/shop/search-pdb as preventing eviction of the search pods on the drained node"
partial_if_only: ["names the node drain is stuck", "names search pods cannot be evicted"]
chain:
  - from: Node/worker-3
    relation: "hosts pods that are protected by the PDB"
    to: Pod/shop/search-0
    fields: "Pod.spec.nodeName=worker-3; Pod status Running"
    abnormal: "kubectl drain reports 'cannot evict pod as it would violate the pod's disruption budget' at T0-5m"
  - from: Pod/shop/search-0
    relation: "protected by PodDisruptionBudget via selector"
    to: PodDisruptionBudget/shop/search-pdb
    fields: "PDB.spec.selector.matchLabels.app=search, minAvailable=2; Pod.metadata.labels.app=search; current healthy pods=2"
    abnormal: "PDB status.currentHealthy=2, desiredHealthy=2; disruptionsAllowed=0; both search pods scheduled on worker-3"
decoys:
  - object: PodDisruptionBudget/shop/frontend-pdb
    looks_like: "another PDB that might be involved"
    why_not: "frontend-pdb has disruptionsAllowed>0 and its pods are spread; the error message names the search pods"
  - object: Deployment/shop/search
    looks_like: "the search Deployment has only 2 replicas"
    why_not: "the replica count is intentional; the PDB is correctly enforcing minAvailable but the co-location on one node creates the drain deadlock"
  - object: Node/worker-3
    looks_like: "the node itself is NotReady or tainted"
    why_not: "the node is Ready and schedulable; the block is purely from the PDB during voluntary eviction"
timeline:
  - "T0-4h: Deployment/shop/search running with 2 replicas, both scheduled on worker-3 due to affinity"
  - "T0-2h: PodDisruptionBudget/shop/search-pdb created with minAvailable=2"
  - "T0-10m: operator starts drain of worker-3 for maintenance"
  - "T0-5m: drain stuck on search pods with PDB violation message"
  - "T0: operator asks why the drain is stuck"
objects:
  - Namespace/shop: Active
  - Namespace/payments: Active
  - Namespace/kube-system: Active
  - Node/worker-3: Ready, SchedulingDisabled (draining)
  - Node/worker-1: Ready
  - Node/worker-2: Ready
  - Deployment/shop/search: 2/2 Ready, both on worker-3
  - Deployment/shop/frontend: 3/3 Ready
  - Deployment/shop/cart: 2/2 Ready
  - Deployment/payments/payment-api: 3/3 Ready
  - PodDisruptionBudget/shop/search-pdb: minAvailable=2, disruptionsAllowed=0
  - PodDisruptionBudget/shop/frontend-pdb: minAvailable=1, disruptionsAllowed=2
  - Pod/shop/search-0: Running on worker-3
  - Pod/shop/search-1: Running on worker-3
  - Pod/shop/frontend-abc: Running on worker-1
  - Service/shop/search: ClusterIP
  - ConfigMap/shop/search-config: present
  - ServiceAccount/shop/search: present
  - NetworkPolicy/shop/allow-search: present
  - ResourceQuota/shop/rq: present
  - LimitRange/shop/lr: present
