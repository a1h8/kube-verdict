# Diagnosis coverage — one row per cause, checked against the code by tools/coverage.py.
# Reference catalog: prometheus-operator/runbooks @ a685d14cf512 (Apache-2.0), runbooks
# kubernetes/* and node/*, whose "Diagnosis" sections list the causes below; plus the
# families of docs/incident-corpus.md. Only `live` is a judgment (with its reason);
# signals, rule and cases are verified by the script.
#
# A row cites a runbook only when that runbook's Diagnosis section names the cause.
# fields: id, cause, family, runbooks, signals (kinds that show it), rule (rule id or null),
#         cases (native cases where it is the cause), live (yes | partial | no) + live_note
rows:
- id: missing-config
  cause: a referenced ConfigMap, Secret or volume does not exist
  family: config-missing
  runbooks:
  - KubePodCrashLooping
  - KubePodNotReady
  - KubeContainerWaiting
  signals:
  - dependency.missing
  - container.config_error
  rule: dependency.missing
  cases:
  - h001
  - h004
  - h024
  live: 'yes'
  live_note: kubelet events and the readiness detector, collected live
  terms: configmaps?/secrets?|missing files
- id: oom-limit
  cause: the container needs more memory than its limit
  family: oom
  runbooks:
  - KubePodCrashLooping
  - KubePodNotReady
  signals:
  - container.oom_killed
  rule: oom.limit
  cases: []
  live: 'yes'
  live_note: container lastState is collected live
  terms: memory
- id: oom-memory-drift
  cause: the deployed memory limit differs from the declared one
  family: oom
  runbooks:
  - KubePodCrashLooping
  signals:
  - container.oom_killed
  - drift.config
  rule: oom.memory_drift
  cases:
  - h003
  - h024
  live: 'yes'
  live_note: Helm values of the release are collected live
  terms: memory
- id: image-pull-auth
  cause: the registry refuses the pull credentials
