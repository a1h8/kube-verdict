# The quota rejects the pod at creation (docs/case-audit-001.md, correction 2): no pod exists,
# the Deployment shows 0/2 and the ReplicaFailure condition Kubernetes sets for it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: staging
  uid: dep-staging-worker-service
  labels:
    app.kubernetes.io/name: worker-service
    app.kubernetes.io/instance: worker-service
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: worker-service
    meta.helm.sh/release-namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-service
      app.kubernetes.io/instance: worker-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-service
        app.kubernetes.io/instance: worker-service
    spec:
      serviceAccountName: worker-service
      containers:
      - name: worker-service
        image: ghcr.io/acme/worker-service:1.4.0
        resources:
          limits:
            memory: 256Mi
            cpu: "1"
          requests:
            memory: 128Mi
            cpu: 500m
status:
  replicas: 0
  readyReplicas: 0
  availableReplicas: 0
  unavailableReplicas: 2
  conditions:
  - type: Available
    status: "False"
    reason: MinimumReplicasUnavailable
    message: Deployment does not have minimum availability.
  - type: ReplicaFailure
    status: "True"
    reason: FailedCreate
    message: 'pods "worker-service-7d8f9c6b5-" is forbidden: exceeded quota: staging-compute-quota, requested: requests.cpu=500m, used: requests.cpu=3800m, limited: requests.cpu=4'
  - type: Progressing
    status: "True"
    reason: ReplicaSetUpdated
    message: ReplicaSet "worker-service-7d8f9c6b5" is progressing.
