# Declared chart values for invoice — the new tag v2.4.0, equal to the deployed release (no drift)
replicaCount: 3

image:
  repository: ghcr.io/acme/invoice
  tag: "v2.4.0"
  pullPolicy: IfNotPresent

resources:
  limits:
    memory: 512Mi
    cpu: "1"
  requests:
    memory: 256Mi
    cpu: 200m

service:
  type: ClusterIP
  port: 8080
