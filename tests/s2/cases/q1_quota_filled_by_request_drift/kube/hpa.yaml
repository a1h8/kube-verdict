apiVersion: v1
kind: HorizontalPodAutoscalerList
metadata: {}
items:
- apiVersion: autoscaling/v2
  kind: HorizontalPodAutoscaler
  metadata:
    name: catalog-api
    namespace: shop
    uid: hpa-shop-catalog-api
  spec:
    scaleTargetRef:
      apiVersion: apps/v1
      kind: Deployment
      name: catalog-api
    minReplicas: 4
    maxReplicas: 20
    metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  status:
    currentReplicas: 20
    desiredReplicas: 20
    currentMetrics:
    - type: Resource
      resource:
        name: cpu
        current:
          averageUtilization: 70
    conditions:
    - type: ScalingLimited
      status: 'True'
      reason: TooManyReplicas
      message: the desired replica count is more than the maximum replica count
- apiVersion: autoscaling/v2
  kind: HorizontalPodAutoscaler
  metadata:
    name: search-api
    namespace: shop
    uid: hpa-shop-search-api
  spec:
    scaleTargetRef:
      apiVersion: apps/v1
      kind: Deployment
      name: search-api
    minReplicas: 3
    maxReplicas: 8
    metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  status:
    currentReplicas: 3
    desiredReplicas: 3
    currentMetrics:
    - type: Resource
      resource:
        name: cpu
        current:
          averageUtilization: 52
