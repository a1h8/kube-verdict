apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: platform
  uid: dep-platform-inventory
  labels:
    app.kubernetes.io/name: inventory
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: inventory
    meta.helm.sh/release-namespace: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory
    spec:
      containers:
      - name: inventory
        image: ghcr.io/acme/inventory:2.0.0
        ports:
        - containerPort: 9090
          name: http
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 9090
          periodSeconds: 10
