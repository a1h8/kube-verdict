apiVersion: v1
kind: MutatingWebhookConfigurationList
metadata: {}
items:
- apiVersion: admissionregistration.k8s.io/v1
  kind: MutatingWebhookConfiguration
  metadata:
    name: mesh-injector
    uid: mwc-mesh-injector
    annotations:
      meta.helm.sh/release-name: mesh-injector
      meta.helm.sh/release-namespace: mesh-system
  webhooks:
  - name: inject.mesh.acme.io
    admissionReviewVersions:
    - v1
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        namespace: mesh-system
        name: mesh-injector
        path: /inject
        port: 443
    namespaceSelector:
      matchLabels:
        mesh-injection: enabled
    rules:
    - operations:
      - CREATE
      apiGroups:
      - ''
      apiVersions:
      - v1
      resources:
      - pods
