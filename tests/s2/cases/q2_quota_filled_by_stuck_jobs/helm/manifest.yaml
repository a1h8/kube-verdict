apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: shop
  uid: dep-shop-catalog-api
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/instance: shop
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: shop
    meta.helm.sh/release-namespace: shop
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-api
        app.kubernetes.io/instance: shop
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
      - name: catalog-api
        image: ghcr.io/acme/catalog-api:3.2.0
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 10
---
