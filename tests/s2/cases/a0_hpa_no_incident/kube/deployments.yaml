apiVersion: v1
kind: DeploymentList
metadata: {}
items:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: api
    namespace: shop
    uid: dep-shop-api
    labels:
      app.kubernetes.io/name: api
      app.kubernetes.io/managed-by: Helm
    annotations:
      meta.helm.sh/release-name: api
      meta.helm.sh/release-namespace: shop
  spec:
    replicas: 4
    selector:
      matchLabels:
        app.kubernetes.io/name: api
    template:
      metadata:
        labels:
          app.kubernetes.io/name: api
      spec:
        containers:
        - name: api
          image: ghcr.io/acme/api:3.1.4
          ports:
          - containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1Gi
  status:
    replicas: 4
    readyReplicas: 4
    availableReplicas: 4
    updatedReplicas: 4
    conditions:
    - type: Available
      status: 'True'
