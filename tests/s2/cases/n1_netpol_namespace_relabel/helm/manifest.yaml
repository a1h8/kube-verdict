apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: shop
  uid: dep-shop-checkout-api
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: checkout-api
    meta.helm.sh/release-namespace: shop
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/instance: checkout-api
    spec:
      containers:
      - name: checkout-api
        image: ghcr.io/acme/checkout-api:1.9.2
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
