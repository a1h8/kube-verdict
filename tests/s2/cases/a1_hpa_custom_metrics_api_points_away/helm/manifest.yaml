apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
  uid: dep-shop-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: api
    meta.helm.sh/release-namespace: shop
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
      - name: api
        image: ghcr.io/acme/api:3.1.4
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: shop
  uid: hpa-shop-api
  annotations:
    meta.helm.sh/release-name: api
    meta.helm.sh/release-namespace: shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 4
  maxReplicas: 20
  metrics:
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: '50'
