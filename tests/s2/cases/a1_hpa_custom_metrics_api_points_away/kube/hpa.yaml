apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: shop
  uid: hpa-shop-api
  annotations:
    meta.helm.sh/release-name: api
    meta.helm.sh/release-namespace: shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 4
  maxReplicas: 20
  metrics:
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: '50'
status:
  currentReplicas: 4
  desiredReplicas: 4
  conditions:
  - type: AbleToScale
    status: 'True'
    reason: ReadyForNewScale
  - type: ScalingActive
    status: 'False'
    reason: FailedGetPodsMetric
    message: 'the HPA was unable to compute the replica count: unable to get metric http_requests_per_second: unable to fetch metrics from custom metrics API: the server is currently unable to handle the request (get pods.custom.metrics.k8s.io *)'
