apiVersion: v1
kind: ServiceList
metadata: {}
items:
- apiVersion: v1
  kind: Service
  metadata:
    name: api
    namespace: shop
    uid: svc-shop-api
  spec:
    selector:
      app.kubernetes.io/name: api
    ports:
    - name: http
      port: 80
      targetPort: 8080
- apiVersion: v1
  kind: Service
  metadata:
    name: web
    namespace: shop
    uid: svc-shop-web
  spec:
    selector:
      app.kubernetes.io/name: web
    ports:
    - name: http
      port: 80
      targetPort: 8080
- apiVersion: v1
  kind: Service
  metadata:
    name: worker
    namespace: shop
    uid: svc-shop-worker
  spec:
    selector:
      app.kubernetes.io/name: worker
    ports:
    - name: http
      port: 80
      targetPort: 8080
- apiVersion: v1
  kind: Service
  metadata:
    name: prometheus-server
    namespace: monitoring
    uid: svc-monitoring-prometheus-server
  spec:
    selector:
      app.kubernetes.io/name: prometheus-server
    ports:
    - name: https
      port: 80
      targetPort: 6443
- apiVersion: v1
  kind: Service
  metadata:
    name: prometheus-adapter
    namespace: observability
    uid: svc-observability-prometheus-adapter
  spec:
    selector:
      app.kubernetes.io/name: prometheus-adapter
    ports:
    - name: https
      port: 443
      targetPort: 6443
- apiVersion: v1
  kind: Service
  metadata:
    name: metrics-server
    namespace: kube-system
    uid: svc-kube-system-metrics-server
  spec:
    selector:
      app.kubernetes.io/name: metrics-server
    ports:
    - name: https
      port: 443
      targetPort: 6443
- apiVersion: v1
  kind: Service
  metadata:
    name: coredns
    namespace: kube-system
    uid: svc-kube-system-coredns
  spec:
    selector:
      app.kubernetes.io/name: coredns
    ports:
    - name: https
      port: 80
      targetPort: 6443
- apiVersion: v1
  kind: Service
  metadata:
    name: prometheus-adapter
    namespace: monitoring
    uid: svc-monitoring-prometheus-adapter
  spec:
    selector:
      app.kubernetes.io/name: prometheus-adapter
    ports:
    - name: https
      port: 443
      targetPort: 6443
