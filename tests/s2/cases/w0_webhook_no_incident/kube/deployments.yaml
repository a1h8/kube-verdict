      meta.helm.sh/release-namespace: mesh-system
  spec:
    replicas: 1
    selector:
      matchLabels:
        app.kubernetes.io/name: mesh-injector
    template:
      metadata:
        labels:
          app.kubernetes.io/name: mesh-injector
      spec:
        containers:
        - name: injector
          image: ghcr.io/acme/mesh-injector:1.21.1
          args:
          - --tls-cert=/etc/tls/tls.crt
          - --tls-key=/etc/tls/tls.key
          - --proxy-image=ghcr.io/acme/mesh-proxy:1.21.1
  status:
