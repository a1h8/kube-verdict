apiVersion: v1
kind: DeploymentList
metadata: {}
items:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: cart-api
    namespace: shop
    uid: dep-shop-cart-api
    labels:
      app.kubernetes.io/name: cart-api
      app.kubernetes.io/managed-by: Helm
    annotations:
      meta.helm.sh/release-name: cart-api
      meta.helm.sh/release-namespace: shop
  spec:
    replicas: 2
    selector:
      matchLabels:
        app.kubernetes.io/name: cart-api
    template:
      metadata:
        labels:
          app.kubernetes.io/name: cart-api
      spec:
        containers:
        - name: cart-api
          image: ghcr.io/acme/cart-api:2.4.0
          ports:
          - containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
  status:
    replicas: 2
    readyReplicas: 2
    availableReplicas: 2
    updatedReplicas: 2
    conditions:
    - type: Available
      status: 'True'
