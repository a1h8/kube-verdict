apiVersion: v1
kind: ServiceList
metadata: {}
items:
- apiVersion: v1
  kind: Service
  metadata:
    name: cart-api
    namespace: shop
    uid: svc-shop-cart-api
  spec:
    selector:
      app.kubernetes.io/name: cart-api
    ports:
    - port: 80
      targetPort: 8080
- apiVersion: v1
  kind: Service
  metadata:
    name: checkout
    namespace: shop
    uid: svc-shop-checkout
  spec:
    selector:
      app.kubernetes.io/name: checkout
    ports:
    - port: 80
      targetPort: 8080
- apiVersion: v1
  kind: Service
  metadata:
    name: orders-api
    namespace: shop
    uid: svc-shop-orders-api
  spec:
    selector:
      app.kubernetes.io/name: orders-api
    ports:
    - port: 80
      targetPort: 8080
- apiVersion: v1
  kind: Service
  metadata:
    name: search-api
    namespace: shop
    uid: svc-shop-search-api
  spec:
    selector:
      app.kubernetes.io/name: search-api
    ports:
    - port: 80
      targetPort: 8080
- apiVersion: v1
  kind: Service
  metadata:
    name: web
    namespace: shop
    uid: svc-shop-web
  spec:
    selector:
      app.kubernetes.io/name: web
    ports:
    - port: 80
      targetPort: 8080
- apiVersion: v1
  kind: Service
  metadata:
    name: orders-db
    namespace: data
    uid: svc-data-orders-db
  spec:
    selector:
      app.kubernetes.io/name: orders-db
    ports:
    - port: 5432
      targetPort: 5432
