- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: search-api
    namespace: shop
    uid: dep-shop-search-api
    labels:
      app.kubernetes.io/name: search-api
      app.kubernetes.io/managed-by: Helm
    annotations:
      meta.helm.sh/release-name: search-api
      meta.helm.sh/release-namespace: shop
  spec:
    replicas: 2
    selector:
      matchLabels:
        app.kubernetes.io/name: search-api
    template:
      metadata:
        labels:
          app.kubernetes.io/name: search-api
      spec:
        containers:
        - name: search-api
          image: ghcr.io/acme/search-api:4.0.2
          ports:
          - containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
          - name: flags
            mountPath: /etc/flags
            readOnly: true
          - name: search-config
            mountPath: /etc/search
            readOnly: true
        volumes:
        - name: flags
          configMap:
            name: feature-flags
        - name: search-config
          configMap:
            name: search-config
  status:
    replicas: 2
    readyReplicas: 0
    availableReplicas: 0
    updatedReplicas: 2
    conditions:
    - type: Available
      status: 'False'
