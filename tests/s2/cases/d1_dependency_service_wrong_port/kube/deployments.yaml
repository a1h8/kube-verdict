- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: redis
    namespace: cache
    uid: dep-cache-redis
    labels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/managed-by: Helm
    annotations:
      meta.helm.sh/release-name: redis
      meta.helm.sh/release-namespace: cache
  spec:
    replicas: 1
    selector:
      matchLabels:
        app.kubernetes.io/name: redis
    template:
      metadata:
        labels:
          app.kubernetes.io/name: redis
      spec:
        containers:
        - name: redis
          image: docker.io/library/redis:7.2.5
          ports:
          - containerPort: 6379
            name: redis
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 768Mi
          args:
          - --maxmemory
          - 512mb
          - --maxmemory-policy
          - noeviction
          - --appendonly
          - 'no'
  status:
    replicas: 1
    readyReplicas: 1
    availableReplicas: 1
    updatedReplicas: 1
    conditions:
    - type: Available
      status: 'True'
