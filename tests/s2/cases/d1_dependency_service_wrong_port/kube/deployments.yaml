apiVersion: v1
kind: DeploymentList
metadata: {}
items:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: checkout-api
    namespace: shop
    uid: dep-shop-checkout-api
    labels:
      app.kubernetes.io/name: checkout-api
      app.kubernetes.io/managed-by: Helm
    annotations:
      meta.helm.sh/release-name: checkout-api
      meta.helm.sh/release-namespace: shop
  spec:
    replicas: 3
    selector:
      matchLabels:
        app.kubernetes.io/name: checkout-api
    template:
      metadata:
        labels:
          app.kubernetes.io/name: checkout-api
      spec:
        containers:
        - name: checkout-api
          image: ghcr.io/acme/checkout-api:3.1.4
          ports:
          - containerPort: 8080
            name: http
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 10
  status:
    replicas: 3
    readyReplicas: 3
    availableReplicas: 3
    updatedReplicas: 3
    conditions:
    - type: Available
      status: 'True'
