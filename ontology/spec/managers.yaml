# Field managers and their role (docs/anchors-and-relations.md, amendment "what may change is observed live").
# Manager names are not standardised: an entry is listed only when a source shows it. A manager that is not listed has
# an unknown role, and a field it owns is never reported as a sure drift. The rest is filled from a live cluster.
version: 1
managers:
  - name: kube-controller-manager
    role: controller
    sources:
      - https://kubernetes.io/docs/reference/using-api/server-side-apply/
  - name: kubectl
    role: person
    sources:
      - https://kubernetes.io/docs/reference/using-api/server-side-apply/
